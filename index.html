<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gourd Wars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #24211d; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }

  #tuning {
    display: none; position: fixed; top: 12px; right: 12px; width: 320px;
    max-height: calc(100vh - 24px); overflow-y: auto; box-sizing: border-box;
    padding: 10px 12px; border-radius: 8px; background: rgba(30, 27, 24, 0.92);
    color: #eee; font: 12px system-ui, sans-serif; user-select: none;
  }
  #tuning.open { display: block; }
  #tuning .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  #tuning .head span { color: #9a9086; font-size: 11px; }
  #tuning .tabs { display: flex; gap: 4px; margin: 6px 0 4px; }
  #tuning .tabs button { padding: 5px 2px; font-size: 11px; background: #3a3531; }
  #tuning .tabs button.on { background: #f28c28; color: #1e1b18; font-weight: 600; }
  #tuning .tabs button.changed:not(.on) { box-shadow: inset 0 -2px 0 #ffcf6e; }
  #tuning .group { border-bottom: 1px solid #3a3531; }
  #tuning button.group-head {
    display: flex; justify-content: space-between; width: 100%; padding: 7px 2px; border-radius: 0;
    background: transparent; color: #f2a65a; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; text-align: left;
  }
  #tuning button.group-head:hover { background: #2c2824; }
  #tuning .group-head span:first-child::before { content: '▸ '; }
  #tuning .group.open .group-head span:first-child::before { content: '▾ '; }
  #tuning .group-head .badge { color: #ffcf6e; text-transform: none; letter-spacing: 0; }
  #tuning .group-body { display: none; padding: 2px 0 8px; }
  #tuning .group.open .group-body { display: block; }
  #tuning .row { display: grid; grid-template-columns: 116px 1fr 40px; gap: 6px; align-items: center; margin: 2px 0; }
  #tuning .row label { cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #tuning .row.changed label, #tuning .row.changed .val { color: #ffcf6e; }
  #tuning input[type=range] { width: 100%; margin: 0; accent-color: #f28c28; }
  #tuning .val { text-align: right; font-variant-numeric: tabular-nums; }
  #tuning .buttons { display: flex; gap: 6px; margin-top: 10px; }
  #tuning button {
    flex: 1; padding: 5px; border: 0; border-radius: 4px; cursor: pointer;
    background: #4a4440; color: #eee; font: inherit;
  }
  #tuning button:hover { background: #5c5550; }
  #tuning .note { display: none; margin: 4px 0; padding: 5px 7px; border-radius: 4px; background: #4a3a28; color: #ffcf6e; }
  #tuning.disabled .note { display: block; }
  #tuning.disabled .row { opacity: 0.45; }

  #menu {
    display: none; position: fixed; inset: 0; align-items: center; justify-content: center;
    background: rgba(36, 33, 29, 0.55); font: 15px system-ui, sans-serif; color: #3b3631;
    --display: 'Luckiest Guy', 'Arial Black', system-ui, sans-serif;   /* the logo's font: titles, headings, buttons */
  }
  #menu.open { display: flex; }
  /* out of the game (main menu, joining, map editor list): just a backdrop, no arena behind the card */
  #menu.solid { background: radial-gradient(ellipse at 50% 35%, #4a3c2c 0%, #2e2822 55%, #1e1b18 100%); }
  #menu .card {
    width: min(420px, calc(100vw - 32px)); box-sizing: border-box; padding: 24px;
    max-height: calc(100vh - 32px); overflow-y: auto;
    border-radius: 12px; background: #f4efe6; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35); text-align: center;
  }
  #menu h1 {
    margin: 0 0 18px; font: 400 36px/1.1 var(--display); letter-spacing: 0.03em; color: #f28c28;
    -webkit-text-stroke: 0.08em #2a1d10; paint-order: stroke fill; text-shadow: 0 0.07em 0 #2a1d10;
  }
  #menu .screen { display: none; flex-direction: column; gap: 10px; }
  #menu .screen.active { display: flex; }
  /* pill buttons that sit on a little ledge (--edge) and press down into it */
  #menu button {
    --edge: #1a1612;
    padding: 14px 20px 10px; border: 0; border-radius: 999px; cursor: pointer;
    background: #3b3631; color: #f4efe6; font: 400 18px/1 var(--display); letter-spacing: 0.04em;
    box-shadow: 0 4px 0 var(--edge); transition: transform 0.08s, box-shadow 0.08s, background 0.08s;
  }
  #menu button:hover { background: #4d4741; transform: translateY(-1px); box-shadow: 0 5px 0 var(--edge); }
  #menu button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
  #menu button.primary { --edge: #9c4f0c; background: #e07a1a; color: #fff; }
  #menu button.primary:hover { background: #f28c28; }
  #menu button.quiet, #menu button.quiet:hover, #menu button.quiet:active { background: transparent; color: #8a8073; box-shadow: none; transform: none; }
  #menu button.quiet:hover { color: #3b3631; }
  #menu .code { font: 400 56px/1.1 var(--display); letter-spacing: 0.12em; color: #3b3631; }
  #menu input {
    padding: 12px 10px 8px; border: 2px solid #c9bfb2; border-radius: 999px; background: #fff; text-align: center;
    font: 400 32px/1.1 var(--display); letter-spacing: 0.15em; text-transform: uppercase;
  }
  #menu input:focus { outline: none; border-color: #e07a1a; }
  #menu .status { min-height: 1.3em; margin: 0; color: #6b6358; font-size: 13px; }
  #menu [data-text=host-status]:empty { display: none; }
  #menu .label { margin: 0; color: #8a8073; font: 400 15px/1.2 var(--display); letter-spacing: 0.04em; }
  #menu .label.note { font: 13px system-ui, sans-serif; letter-spacing: 0; }   /* (sentences read better in the plain font) */
  #menu .match-settings { display: flex; flex-direction: column; gap: 6px; }
  #menu .seg { display: flex; gap: 4px; }
  #menu .seg button, #menu .map-grid button, #menu .pk-on { --edge: #c2b6a5; background: #e2d9cc; color: #3b3631; }
  #menu .seg button:hover, #menu .map-grid button:hover, #menu .pk-on:hover { background: #d6ccbd; }
  #menu .seg button.on, #menu .map-grid button.on { --edge: #1a1612; background: #3b3631; color: #f4efe6; }
  #menu .seg button { flex: 1; padding: 9px 4px 6px; font-size: 14px; }
  #menu .stepper { display: flex; align-items: center; justify-content: center; gap: 12px; }
  #menu .stepper button { width: 36px; height: 36px; padding: 0; font: 600 20px/1 system-ui, sans-serif; }
  #menu .stepper span { min-width: 90px; font: 400 18px/1 var(--display); letter-spacing: 0.04em; }
  #menu .hidden { display: none !important; }
  #menu .map-select, #menu .map-rotation, #menu .dup-list { display: flex; flex-direction: column; gap: 6px; }
  #menu .map-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 6px; }
  #menu .map-grid button { padding: 9px 4px 6px; font-size: 14px; }
  #menu .pumpkin-list { display: flex; flex-direction: column; gap: 8px; }
  #menu .pk-row { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  #menu .pk-row .dot { flex: none; width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.25); }
  #menu .pk-name { flex: 1; text-align: left; white-space: nowrap; }
  #menu .pk-row button { padding: 8px 6px 5px; font-size: 13px; }
  #menu .pk-on { flex: none; width: 56px; }
  #menu .pk-on.on { --edge: #3a6326; background: #5a8f3c; color: #fff; }
  #menu .pk-on.on:hover { background: #67a046; }
  #menu .pk-row .seg { width: 186px; }
  #menu .pk-head { display: flex; align-items: center; gap: 6px; color: #8a8073; font: 400 13px/1 var(--display); letter-spacing: 0.04em; }
  #menu .pk-head span:nth-child(2) { width: 56px; }
  #menu .pk-head span:nth-child(3) { width: 186px; }
  #menu .toggle-row { display: flex; align-items: center; justify-content: space-between; color: #8a8073; font: 400 15px/1 var(--display); letter-spacing: 0.04em; }
  #menu .toggle-row button { padding: 8px 6px 5px; font-size: 13px; }
  #menu .pk-row.off .pk-name, #menu .pk-row.off .seg { opacity: 0.35; }
  #menu textarea {
    box-sizing: border-box; width: 100%; padding: 8px; border: 2px solid #c9bfb2; border-radius: 8px; resize: vertical;
    font: 12px ui-monospace, monospace; word-break: break-all;
  }
  #menu textarea:focus { outline: none; border-color: #e07a1a; }
  #menu .my-maps { display: flex; flex-direction: column; gap: 8px; }
  #menu .my-map { padding: 8px; border-radius: 8px; background: #e9e2d6; text-align: left; }
  #menu .my-map-name { margin-bottom: 6px; font-weight: 600; overflow-wrap: anywhere; }
  #menu .my-map-name .warn { color: #c0392b; font-size: 12px; font-weight: 400; }
  #menu .my-map-buttons { display: flex; gap: 5px; }
  #menu .my-map-buttons button { flex: 1; padding: 8px 2px 5px; font-size: 13px; }
  #menu button:disabled, #menu button:disabled:hover { opacity: 0.35; cursor: default; transform: none; box-shadow: 0 4px 0 var(--edge); }
  #menu button.danger { --edge: #6b2418; background: #a8402f; }
  #menu button.danger:hover { background: #c24d39; }

  /* main menu: the logo across the top, big pill buttons right on the backdrop (no card) */
  #menu .logo {
    display: none; position: absolute; top: 7vh; left: 0; right: 0; text-align: center; pointer-events: none; white-space: nowrap;
    font: 400 clamp(44px, 9vw, 124px)/1 'Luckiest Guy', 'Arial Black', Impact, sans-serif; letter-spacing: 0.03em; color: #f28c28;
    -webkit-text-stroke: 0.08em #2a1d10; paint-order: stroke fill; text-shadow: 0 0.07em 0 #2a1d10;
  }
  #menu[data-screen=main] .logo { display: block; }
  /* the wobble: eases out from level right as the last letter lands, then sways side to side, only slowing at the
     ends (the delays are set where the letters are made) */
  #menu .logo .wobble { display: inline-block; will-change: transform; animation: logo-sway-in 0.9s ease-in-out both, logo-sway 1.8s ease-in-out infinite alternate; }
  #menu .logo .ch { display: inline-block; will-change: transform; animation: logo-drop 0.8s ease-in both; }
  #menu .logo .gap { display: inline-block; width: 0.3em; }
  @keyframes logo-drop {
    0% { transform: translateY(-80vh) rotate(-8deg); }
    55% { transform: translateY(0) rotate(0); }
    70% { transform: translateY(-0.22em); }
    85% { transform: translateY(0); }
    93% { transform: translateY(-0.05em); }
    100% { transform: none; }
  }
  @keyframes logo-sway-in { from { transform: rotate(0deg); } to { transform: rotate(-2deg); } }
  @keyframes logo-sway { from { transform: rotate(-2deg); } to { transform: rotate(2deg); } }
  @media (prefers-reduced-motion: reduce) { #menu .logo .ch, #menu .logo .wobble { animation: none; } }
  #menu[data-screen=main] .card { width: min(300px, calc(100vw - 32px)); margin-top: 18vh; background: transparent; box-shadow: none; }
  #menu[data-screen=main] h1 { display: none; }
  #menu[data-screen=main] .screen { gap: 14px; }
  #menu[data-screen=main] .screen button { padding: 16px 24px 12px; font-size: 22px; background: #f4efe6; color: #3b3631; }
  #menu[data-screen=main] .screen button:hover { background: #fff; }
  #menu[data-screen=main] .screen button.primary { background: #e07a1a; color: #fff; }
  #menu[data-screen=main] .screen button.primary:hover { background: #f28c28; }
  #menu[data-screen=main] .status { color: #e2d9cc; }

  #editor { display: none; font: 13px system-ui, sans-serif; color: #eee; }
  #editor.open { display: block; }
  #editor .bar {
    position: fixed; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
    padding: 6px 8px; box-sizing: border-box; background: #2c2824; box-shadow: 0 1px 0 #1e1b18;
  }
  #editor .bar .gap { flex: 1; }
  #editor button {
    padding: 6px 9px; border: 0; border-radius: 5px; cursor: pointer; background: #4a4440; color: #eee; font: inherit;
  }
  #editor button:hover:not(:disabled) { background: #5c5550; }
  #editor button.on { background: #f28c28; color: #1e1b18; font-weight: 600; }
  #editor .bar .label { margin: 0 2px 0 6px; color: #bdb4aa; }
  #editor button.spawn { display: inline-flex; align-items: center; gap: 4px; padding: 6px 7px; }
  #editor button.spawn .dot { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35); }
  #editor button.primary { background: #e07a1a; color: #1e1b18; font-weight: 600; }
  #editor button.primary:hover { background: #f28c28; }
  #editor button.danger { background: #a8402f; }
  #editor button:disabled { opacity: 0.4; cursor: default; }
  #editor .panel {
    overflow-x: hidden; position: fixed; right: 0; bottom: 0; top: 44px; width: 250px; overflow-y: auto; box-sizing: border-box;
    padding: 4px 12px 12px; background: #2c2824; box-shadow: -1px 0 0 #1e1b18;
  }
  #editor h3 { margin: 14px 0 6px; color: #f2a65a; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
  #editor label { display: block; color: #bdb4aa; }
  #editor .field { margin: 6px 0; }
  #editor input, #editor select {
    box-sizing: border-box; width: 100%; margin-top: 2px; padding: 5px 6px; border: 1px solid #4a4440; border-radius: 4px;
    background: #1e1b18; color: #eee; font: inherit;
  }
  #editor .nums { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #editor .check { display: flex; align-items: center; gap: 6px; margin: 8px 0; }
  #editor .check input { width: auto; margin: 0; }
  #editor .panel > div > button { width: 100%; margin-top: 8px; }
  #editor .hint { margin: 0; color: #bdb4aa; line-height: 1.4; }
  #editor .status { min-height: 1.2em; margin: 6px 0 0; color: #9fd47a; }
  #editor .status.bad { color: #ffb36e; }
  #editor .problem { display: block; width: 100%; margin: 0 0 4px; padding: 5px 7px; border-radius: 4px; text-align: left; line-height: 1.35; }
  #editor .problem.err { background: #5a2420; color: #ffd0c8; }
  #editor .problem.warn { background: #4a3a20; color: #ffe0a8; }
  #editor .problem.ok { background: #2e4422; color: #c8f0a8; }
  #editor button.problem.err:hover { background: #6e2c26; }
  #editor button.problem.warn:hover { background: #5c4826; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="tuning"></div>

<div id="menu" class="open solid" data-screen="main">
  <!-- the game's name across the top of the main menu: drops in letter by letter, then wobbles -->
  <div class="logo" aria-label="Gourd Wars"></div>
  <div class="card">
    <h1 data-text="menu-title">Gourd Wars</h1>
    <!-- data-title: the card's heading on that screen (the main menu has the logo instead) -->
    <div class="screen active" data-screen="main" data-title="Gourd Wars">
      <button class="primary" data-act="host">Host Game</button>
      <button data-act="show-join">Join Game</button>
      <button data-act="practice">Practice</button>
      <button data-act="show-maps">Map Editor</button>
      <p class="status" data-text="main-status"></p>
    </div>
    <div class="screen" data-screen="host" data-title="Host Game">
      <p class="label">Join Code</p>
      <div class="code" data-text="host-code">····</div>
      <button data-act="copy-code">Copy Code</button>
      <p class="status" data-text="host-status"></p>
      <button data-act="show-match">Match Settings</button>
      <button class="primary" data-act="resume" data-text="wait-play">Play vs Dummies While Waiting</button>
      <button class="quiet" data-act="leave">Back</button>
    </div>
    <div class="screen" data-screen="join" data-title="Join Game">
      <p class="label">Enter join code</p>
      <input data-input="join-code" maxlength="4" autocomplete="off" spellcheck="false" placeholder="CODE">
      <button class="primary" data-act="connect">Join</button>
      <p class="status" data-text="join-status"></p>
      <button class="quiet" data-act="leave">Back</button>
    </div>
    <div class="screen" data-screen="paused" data-title="Game Menu">
      <p class="status" data-text="paused-info"></p>
      <button class="primary" data-act="resume">Resume</button>
      <button data-act="show-match" data-show="settings">Settings</button>
      <button data-act="exit" data-text="exit-label">Exit</button>
    </div>
    <!-- Match Settings (from the host screen) / Settings (from the Esc menu): only the parts that apply right now -->
    <div class="screen" data-screen="match" data-title="Match Settings">
      <div class="match-settings" data-show="match-length"></div>
      <div class="map-rotation" data-show="rotation"></div>
      <div class="toggle-row" data-show="rotation"><span>Random Order</span><button class="pk-on" data-act="order-toggle">On</button></div>
      <div class="map-select" data-show="practice-map"></div>
      <div class="dummy-select" data-show="dummies"></div>
      <button data-act="show-pumpkins">Pumpkins</button>
      <button data-act="restart" data-show="restart">Restart Match</button>
      <button class="primary" data-act="match-done">Done</button>
    </div>
    <div class="screen" data-screen="pumpkins" data-title="Pumpkins">
      <div class="pumpkin-list"></div>
      <button class="primary" data-act="pumpkins-done">Done</button>
    </div>
    <div class="screen" data-screen="maps" data-title="Map Editor">
      <p class="label note">Your maps (when you host, your friends get them too)</p>
      <div class="my-maps"></div>
      <p class="status" data-text="maps-status"></p>
      <button class="primary" data-act="map-new">New Map</button>
      <button data-act="show-import">Import a Map Code</button>
      <div class="dup-list">
        <p class="label note">Or start from a copy of a built-in map</p>
        <div class="map-grid dup-builtin"></div>
      </div>
      <button class="quiet" data-act="maps-back">Back</button>
    </div>
    <div class="screen" data-screen="import" data-title="Import a Map">
      <p class="label">Paste a map code</p>
      <textarea data-input="map-code" rows="6" spellcheck="false" placeholder="PFMAP1:…"></textarea>
      <button class="primary" data-act="map-import">Import</button>
      <p class="status" data-text="import-status"></p>
      <button class="quiet" data-act="show-maps">Back</button>
    </div>
    <div class="screen" data-screen="export" data-title="Map Code">
      <p class="label note" data-text="export-title"></p>
      <textarea data-input="export-code" rows="6" readonly spellcheck="false"></textarea>
      <button class="primary" data-act="export-copy">Copy Code</button>
      <p class="status" data-text="export-status"></p>
      <button class="quiet" data-act="show-maps">Back</button>
    </div>
  </div>
</div>
<div id="editor"></div>

<script src="https://cdn.jsdelivr.net/npm/planck@1.5.0/dist/planck.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script id="game-script">
'use strict'
const Vec2 = planck.Vec2

// =====================================================================
// CONFIG — tweak numbers here to change how the game feels
// =====================================================================
const CONFIG = {
  gravity: 30,               // m/s² downward (real life is 9.8, games feel better snappier)
  dt: 1 / 60,                // fixed physics step
  view: { w: 32, h: 18 },    // meters visible on screen
  killY: -3,                 // fall below this = dead
  respawnTime: 1.0,
  player: {
    moveSpeed: 7,            // m/s
    groundAccel: 70,         // how fast you reach moveSpeed on the ground
    airAccel: 35,            // ...and in the air
    jumpSpeed: 16,
    coyoteTime: 0.1,         // can still jump this long after walking off a ledge
    jumpBuffer: 0.1,         // jump pressed this long before landing still counts
    hoverHeight: 0.93,       // pelvis height above ground when standing
    hoverReach: 0.4,         // the hover spring catches you within this much extra distance
    hoverK: 180,             // hover spring stiffness
    hoverD: 22,              // hover spring damping
    uprightK: 120,           // how hard the torso tries to stay vertical
    uprightD: 18,
    uprightInertia: 0.6,
    uprightMaxTorque: 50,
    jointK: 15,              // joint motor speed per radian of error
    legTorque: 8,
    armTorque: 4.5,
    neckTorque: 3,
    limpTorque: 0.25,        // joint stiffness while ragdolled (0 = totally floppy)
    recoverTime: 0.4,        // seconds to ramp back to full control after a stun
    maxHealth: 50,           // a full-power ripe pumpkin does 25, a punch 5
  },
  throw: { minSpeed: 14, maxSpeed: 26, chargeTime: 0.7, cooldown: 0.35 },
  punch: {                   // click with empty hands (alternates arms)
    time: 0.2,               // how long the punch lasts
    cooldown: 0.2,
    reach: 0.24,             // extra hit distance around the fist
    knockback: 4.5,          // push speed (m/s) given to whoever gets hit
    damage: 5,               // 4 quick punches stagger
    stun: 0.6,               // ragdoll time if a punch is the hit that staggers
    lunge: 2,                // small forward push on the puncher (m/s)
  },
  match: {
    slowMo: 0.25,            // game speed after a round's last knockout
    lastStandingGrace: 0.5,  // (real s) if the other player also goes down in this window, it's a draw
    roundOverTime: 1.8,      // (real s) slow motion + "Blue wins!", then the pan to the next map
    transitionTime: 1.5,     // the pan to the next map, carrying players to their spawns
    matchOverTime: 5,        // "Blue wins the match!" before a new match starts
  },
  damage: {
    staggerAt: 20,           // stagger meter value that knocks you into a ragdoll
    drainDelay: 0.4,         // seconds after a hit before the meter starts draining
    drainRate: 40,           // meter drain per second
    shoveTime: 0.15,         // hit too small to stagger: no walking control for this long
    shoveScale: 0.4,         // ...and only this fraction of the knockback
  },
  level: {
    baleHealth: 100,         // a ripe Classic does 25
    balePunchMultiplier: 3,  // punches do 3x damage to bales (about 4 punches)
    baleBlastMultiplier: 5,  // blasts do 5x damage to bales (a close one wrecks it)
    balePushForce: 270,      // walking into a bale shoves it with this force (N)...
    balePushSpeed: 3.5,      // ...fading out as it approaches this speed (it settles around 2 m/s)

// How often each type grows (host setting): relative weights.
const SPAWN_RATES = { common: 20, normal: 5, rare: 1 }
const defaultSpawnSettings = () =>

// Weighted random pick among the enabled types (Classic if everything is off).
function pickPumpkinType(settings) {
  const options = SPAWNABLE_TYPES.filter(k => settings[k] && settings[k].on)
  if (!options.length) return 'classic'
  const weight = k => SPAWN_RATES[settings[k].rate] || 0
  let r = Math.random() * options.reduce((sum, k) => sum + weight(k), 0)
  for (const k of options) {
    r -= weight(k)
    if (r < 0) return k
  }
  return options[options.length - 1]
}

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v))
const lerp = (a, b, t) => a + (b - a) * t
const wrapAngle = a => a - 2 * Math.PI * Math.floor((a + Math.PI) / (2 * Math.PI))
const r3 = v => Math.round(v * 1000) / 1000
function distToSegment(p, a, b) {
  const abx = b.x - a.x, aby = b.y - a.y
  const len2 = abx * abx + aby * aby
  const t = len2 ? clamp(((p.x - a.x) * abx + (p.y - a.y) * aby) / len2, 0, 1) : 0
  return Math.hypot(p.x - (a.x + abx * t), p.y - (a.y + aby * t))
}

// INPUT
// Every player is controlled by a plain input object. The local keyboard,
// the dummy, and (later) the network all produce this same shape.
// =====================================================================
function emptyInput() {
  return { left: false, right: false, jump: false, throw: false, harvest: false, ragdoll: false, aimX: 0, aimY: 0 }
}

// A practice dummy just stands there, looking at the nearest real player.
function dummyInput(game, dummy) {
  const me = dummy ? dummy.torso.getPosition() : null
  let target = null, best = Infinity
  for (const p of game.players) {
    if (p.isDummy || p === dummy) continue
    const q = p.torso.getPosition(), d = me ? Math.hypot(q.x - me.x, q.y - me.y) : 0
    if (d < best) { best = d; target = q }
  }
  return target ? { ...emptyInput(), aimX: target.x, aimY: target.y } : emptyInput()
}

// =====================================================================
// MAP DATA — custom maps: checking, cleaning up, saving, sharing as codes.
// A custom map uses the same format as the built-in MAPS (theme by name).
// =====================================================================
const CUSTOM_MAPS_KEY = 'pumpkin-fight-custom-maps'
const MAP_CODE_PREFIX = 'PFMAP1:'
const MAP_LIMITS = { platforms: 80, patches: 12, bales: 30, spikes: 20, fires: 10, scythes: 6, movers: 12 }
const newMapId = () => 'c_' + Math.random().toString(36).slice(2, 10)

// Clean up a map from anywhere (storage, an imported code, a host): known fields only,
// numbers kept on screen and sensible, counts capped. Returns null if it isn't a map at all.
function sanitizeMap(raw) {
  if (!raw || typeof raw !== 'object') return null
  const W = CONFIG.view.w, H = CONFIG.view.h
  const num = (v, lo, hi, d) => { v = Number(v); return Number.isFinite(v) ? clamp(v, lo, hi) : d }
  const list = (a, max) => (Array.isArray(a) ? a.filter(o => o && typeof o === 'object').slice(0, max) : [])
  const pt = o => ({ x: num(o.x, 0, W, W / 2), y: num(o.y, 0, H, 4) })
  const map = {
    id: typeof raw.id === 'string' && /^c_[a-z0-9]{4,16}$/.test(raw.id) ? raw.id : newMapId(),
    custom: true,
    name: String(raw.name || 'Custom map').replace(/[\u0000-\u001f]/g, '').slice(0, 32) || 'Custom map',
    theme: THEMES[raw.theme] ? raw.theme : 'paper',
    platforms: list(raw.platforms, MAP_LIMITS.platforms).map(o => ({
      ...pt(o), w: num(o.w, 0.25, W, 2), h: num(o.h, 0.25, H, 0.5), ...(o.wall ? { wall: true } : {}),
    })),
    spawns: list(raw.spawns, MAX_PLAYERS).map(pt),
    patches: list(raw.patches, MAP_LIMITS.patches).map(o => ({ ...pt(o), ...(SPAWNABLE_TYPES.includes(o.only) ? { only: o.only } : {}) })),
    bales: list(raw.bales, MAP_LIMITS.bales).map(pt),
    spikes: list(raw.spikes, MAP_LIMITS.spikes).map(o => ({ ...pt(o), w: num(o.w, 0.3, W, 2) })),
    fires: list(raw.fires, MAP_LIMITS.fires).map(o => ({ ...pt(o), w: num(o.w, 0.4, 6, 1.4) })),
    scythes: list(raw.scythes, MAP_LIMITS.scythes).map(o => ({
      ...pt(o), length: num(o.length, 1.4, 6, 2.6), pole: num(o.pole, 0, H, 2.6), turnTime: num(o.turnTime, 0.5, 10, 3),
    })),
    movers: list(raw.movers, MAP_LIMITS.movers).map(o => {
      const a = pt(o)
      return {
        ...a, w: num(o.w, 0.5, W, 3), h: num(o.h, 0.25, 4, 0.5), x2: num(o.x2, 0, W, a.x), y2: num(o.y2, 0, H, a.y),
        speed: num(o.speed, 0.5, 12, 3), pause: num(o.pause, 0, 5, 1),
      }
    }),
  }
  if (map.spawns.length) fillSpawns(map)   // (maps from before 4 players had 2 spawns)
  return map
}

// The version the game plays: the theme name becomes the theme itself.
function toRuntimeMap(def) {
  return { ...def, theme: THEMES[def.theme] || THEMES.paper, playable: checkMap(def).errors.length === 0 }
}

function encodeMapCode(def) {
  const { custom, ...data } = def
  return MAP_CODE_PREFIX + btoa(unescape(encodeURIComponent(JSON.stringify(data))))
}

// A map from a pasted code (with a fresh id), or null if the code isn't valid.
function decodeMapCode(code) {
  try {
    const text = String(code).trim()
    if (!text.startsWith(MAP_CODE_PREFIX)) return null
    const def = sanitizeMap(JSON.parse(decodeURIComponent(escape(atob(text.slice(MAP_CODE_PREFIX.length))))))
    if (def) def.id = newMapId()
    return def
  } catch (e) {
    return null
  }
}

// A built-in or custom map as an editable custom map.
function duplicateMap(id, name) {
  const src = MAPS[id]
  const themeName = Object.keys(THEMES).find(k => THEMES[k] === src.theme)
  return sanitizeMap({ ...JSON.parse(JSON.stringify({ ...src, theme: null })), theme: themeName, id: null, name })
}

const mapTop = p => p.y + p.h / 2
const onTopOf = (pt, p) => Math.abs(mapTop(p) - pt.y) < 0.06 && pt.x > p.x - p.w / 2 && pt.x < p.x + p.w / 2
const insideOf = (pt, p) => Math.abs(pt.x - p.x) < p.w / 2 && Math.abs(pt.y - p.y) < p.h / 2
// is pt within pad meters of a pitchfork row, a bonfire or a scythe's reach?
const mapHazardAt = (def, pt, pad) =>
  def.spikes.some(sp => pt.x > sp.x - sp.w / 2 - pad && pt.x < sp.x + sp.w / 2 + pad && pt.y > sp.y - pad && pt.y < sp.y + 0.6 + pad) ||
  def.fires.some(f => pt.x > f.x - f.w / 2 - pad && pt.x < f.x + f.w / 2 + pad && pt.y > f.y - pad && pt.y < f.y + 0.9 + pad) ||
  def.scythes.some(sc => Math.hypot(pt.x - sc.x, pt.y - sc.y) < sc.length + 0.3 + pad)

// What you can get to from the spawns: jump up/across, drop down, or ride a moving platform.
// Returns { nodes, seen }: nodes = floors (plus both ends of each mover), seen = the reachable ones.
const JUMP_UP = 3.8, JUMP_ACROSS = 4.6, DROP_ACROSS = 6.5   // what a jump can reach (a bit under the max)
function mapReach(def) {
  // (a floor that's all pitchforks doesn't count; one with a few on it still does)
  const spikeFloor = p => def.spikes.filter(sp => Math.abs(mapTop(p) - sp.y) < 0.05)
    .reduce((sum, sp) => sum + Math.max(0, Math.min(p.x + p.w / 2, sp.x + sp.w / 2) - Math.max(p.x - p.w / 2, sp.x - sp.w / 2)), 0) > p.w - 1
  const nodes = def.platforms.filter(p => !p.wall && !spikeFloor(p))
  // a moving platform counts as a platform at both ends of its trip (and riding it links them)
  def.movers.forEach((m, index) => {
    const a = { x: m.x, y: m.y, w: m.w, h: m.h, mover: index, start: true }, b = { x: m.x2, y: m.y2, w: m.w, h: m.h, mover: index }
    a.pair = b; b.pair = a
    nodes.push(a, b)
  })
  const gap = (a, b) => Math.max(0, Math.max(a.x - a.w / 2, b.x - b.w / 2) - Math.min(a.x + a.w / 2, b.x + b.w / 2))
  const seen = new Set(def.spawns.map(sp => nodes.find(p => onTopOf(sp, p))).filter(Boolean))
  for (const p of [...seen]) if (p.pair) seen.add(p.pair)
  for (let grew = true; grew;) {
    grew = false
    for (const q of [...seen]) for (const p of nodes) {
      if (seen.has(p)) continue
      const dy = mapTop(p) - mapTop(q)
      if ((dy <= JUMP_UP && dy >= -0.01 && gap(p, q) <= JUMP_ACROSS) || (dy < 0 && gap(p, q) <= DROP_ACROSS)) {
        seen.add(p)
        if (p.pair) seen.add(p.pair)
        grew = true
      }
    }
  }
  return { nodes, seen }
}

// Is this a good place for a player to start? (on a floor, room to stand, away from hazards)
const goodSpawnSpot = (def, sp) => {
  const body = { x: sp.x, y: sp.y + 1 }
  return def.platforms.some(p => !p.wall && onTopOf(sp, p)) &&
    ![body, { x: sp.x, y: sp.y + 1.9 }].some(q => def.platforms.some(p => insideOf(q, p)) || def.movers.some(m => insideOf(q, m))) &&
    !mapHazardAt(def, body, 1.5) && !mapHazardAt(def, sp, 1.5)
}

// Add the missing spawns (up to 4): the good spot on a reachable floor farthest from the
// spawns already there. Always picks the same spots for the same map.
function fillSpawns(def) {
  const { seen } = mapReach(def)
  const floors = def.platforms.filter(p => seen.has(p))
  while (def.spawns.length < MAX_PLAYERS) {
    let best = null, bestDist = 1.5
    for (const p of floors) {
      for (let x = p.x - p.w / 2 + 0.6; x <= p.x + p.w / 2 - 0.6; x += 0.5) {
        const sp = { x: r3(x), y: r3(mapTop(p)) }
        const dist = Math.min(...def.spawns.map(o => Math.hypot(o.x - sp.x, o.y - sp.y)))
        if (dist > bestDist + 1e-6 && goodSpawnSpot(def, sp)) { best = sp; bestDist = dist }
      }
    }
    if (!best) break   // no room: the checks will ask for it
    def.spawns.push(best)
  }
  return def
}

// Problems with a map. errors = must fix before it can be played; warnings = worth a look.
// Each problem: { msg, kind, index } (kind/index point at the piece, for the editor to select).
function checkMap(def) {
  const errors = [], warnings = []
  const hazardAt = (pt, pad) => mapHazardAt(def, pt, pad)

  if (def.spawns.length < MAX_PLAYERS) {
    const missing = Array.from({ length: MAX_PLAYERS - def.spawns.length }, (_, k) => def.spawns.length + k + 1)
    errors.push({ msg: `Place spawn${missing.length > 1 ? 's' : ''} ${missing.join(', ')}.`, kind: 'spawns', index: def.spawns.length })
  }
  def.spawns.forEach((sp, i) => {
    const body = { x: sp.x, y: sp.y + 1 }   // middle of a standing stick figure
    if (!def.platforms.some(p => onTopOf(sp, p))) errors.push({ msg: `Spawn ${i + 1} isn't standing on a platform.`, kind: 'spawns', index: i })
    else if (def.platforms.some(p => insideOf(body, p)) || def.movers.some(m => insideOf(body, m))) errors.push({ msg: `Spawn ${i + 1} is inside a platform or wall.`, kind: 'spawns', index: i })
    if (hazardAt(body, 0.2) || hazardAt(sp, 0.2)) errors.push({ msg: `Spawn ${i + 1} is in a hazard.`, kind: 'spawns', index: i })
    else if (hazardAt(body, 1.5)) warnings.push({ msg: `Spawn ${i + 1} is right next to a hazard.`, kind: 'spawns', index: i })
    def.spawns.forEach((o, j) => {
      if (j > i && Math.hypot(o.x - sp.x, o.y - sp.y) < 1.2) warnings.push({ msg: `Spawns ${i + 1} and ${j + 1} are on top of each other.`, kind: 'spawns', index: j })
    })
  })
  if (!def.patches.length) warnings.push({ msg: 'No pumpkin patches: only punches!', kind: null, index: -1 })
  def.patches.forEach((pt, i) => {
    if (!def.platforms.some(p => onTopOf(pt, p))) warnings.push({ msg: `Patch ${i + 1} isn't on a platform.`, kind: 'patches', index: i })
    else if (def.platforms.some(p => insideOf({ x: pt.x, y: pt.y + 0.3 }, p))) warnings.push({ msg: `Patch ${i + 1} is buried in a platform or wall.`, kind: 'patches', index: i })
  })
  def.bales.forEach((b, i) => {
    const c = { x: b.x, y: b.y + BALE.h / 2 }
    if (def.platforms.some(p => insideOf(c, p))) warnings.push({ msg: `Hay bale ${i + 1} is stuck inside a platform.`, kind: 'bales', index: i })
  })

  const { nodes, seen } = mapReach(def)
  if (seen.size) {
    nodes.forEach(p => {
      if (seen.has(p)) return
      if (p.mover === undefined) warnings.push({ msg: 'A platform is out of jumping reach.', kind: 'platforms', index: def.platforms.indexOf(p) })
      else if (p.start) warnings.push({ msg: 'A moving platform is out of jumping reach.', kind: 'movers', index: p.mover })   // (once per mover)
    })
  }
  return { errors, warnings }
}

// Saved custom maps (this browser).
function loadCustomMaps() {
  try {
    const list = JSON.parse(localStorage.getItem(CUSTOM_MAPS_KEY)) || []
    return list.map(sanitizeMap).filter(Boolean)
  } catch (e) {
    return []
  }
}
function saveCustomMaps(defs) {
  try { localStorage.setItem(CUSTOM_MAPS_KEY, JSON.stringify(defs)) } catch (e) {}
}
const registerMap = def => { MAPS[def.id] = toRuntimeMap(def) }
const unregisterMap = id => { if (MAPS[id] && MAPS[id].custom) delete MAPS[id] }

// =====================================================================
// WORLD & LEVEL
// =====================================================================
function createGame() {
  const world = new planck.World({ gravity: new Vec2(0, -CONFIG.gravity) })
  // events: things that happened this step that the screen should show (e.g. splats)
  // match: null = practice rules (nobody dies, no rounds); see MATCH below
  // spawnSettings: which pumpkin types grow and how often (the host's menu replaces this object)
  // map: the loaded map; mapChoice: the one to load at the next round reset (set from the menu)
  // roundTime: seconds since the round started (scarecrows spin with it)
  // movers: moving platforms { def, body }; moverTime: how far along their trips they are
  const game = {
    world, time: 0, players: [], pumpkins: [], patches: [], bales: [], contacts: [], events: [],
    nextPumpkinId: 1, nextBaleId: 1, match: null, spawnSettings: defaultSpawnSettings(),
    map: null, mapChoice: 'patch', mapBodies: [], scythes: [], movers: [], moverTime: 0, hazardHits: [], roundTime: 0,
    timeScale: 1,       // < 1 = slow motion (after a round's last knockout)
    joining: [],        // slots waiting to jump in at the start of the next round
    transition: null,   // the pan to a new map: { from, elapsed, duration, starts }
  }

  addPlayer(game, 0)
  addPlayer(game, 1, { dummy: true })

  // Can't change bodies in the middle of a physics step, so just record contacts here.
  world.on('begin-contact', contact => {
    recordPumpkinContact(game, contact.getFixtureA(), contact.getFixtureB())
    recordPumpkinContact(game, contact.getFixtureB(), contact.getFixtureA())
    recordHazardContact(game, contact.getFixtureA(), contact.getFixtureB())
    recordHazardContact(game, contact.getFixtureB(), contact.getFixtureA())
  })
  // Pumpkins don't physically shove players; the knockback comes only from applyHit(),
  // so it follows our numbers (damage, stagger, ripeness) instead of raw collision physics.
  // (Squash Balls are the exception: they bounce off people.)
  world.on('pre-solve', contact => {
    const a = contact.getFixtureA().getBody().getUserData(), b = contact.getFixtureB().getBody().getUserData()
    const pk = a && a.kind === 'pumpkin' ? a.pumpkin : b && b.kind === 'pumpkin' ? b.pumpkin : null
    const other = pk && (a.kind === 'pumpkin' ? b : a)
    if (pk && other && other.kind === 'player' && !pk.type.solidToPlayers) contact.setEnabled(false)
  })
  resetRound(game)
  return game
}

// ---------------------------------------------------------------------
// PLAYERS COMING AND GOING — game.players holds whoever is here, sorted by slot.
// ---------------------------------------------------------------------
const spawnFor = (map, slot) => map.spawns[slot] || map.spawns[slot % 2] || map.spawns[0]
const playerInSlot = (game, slot) => game.players.find(p => p.index === slot)

function addPlayer(game, slot, opts = {}) {
  if (playerInSlot(game, slot)) return playerInSlot(game, slot)
  const p = new Player(game.world, { index: slot, name: PLAYER_COLOR_NAMES[slot], color: PLAYER_COLORS[slot], spawn: spawnFor(currentMap(game), slot) })
  p.isDummy = !!opts.dummy
  game.players.push(p)
  game.players.sort((a, b) => a.index - b.index)
  if (game.match) game.match.scores[slot] = 0   // (a fresh start)
  return p
}

function removePlayer(game, slot) {
  game.joining = game.joining.filter(s => s !== slot)
  const p = playerInSlot(game, slot)
  if (!p) return
  for (const part of p.parts) game.world.destroyBody(part.body)   // (takes the joints with it)
  p.dead = p.removed = true
  p.held = null
  game.players = game.players.filter(q => q !== p)
  for (const pk of game.pumpkins) if (pk.owner === p) pk.owner = null
  const isMine = body => { const ud = body.getUserData(); return ud && ud.player === p }
  game.hazardHits = game.hazardHits.filter(b => !isMine(b))
  game.contacts = game.contacts.filter(c => !isMine(c.other))
  if (game.match) game.match.scores[slot] = 0
}

// Someone joins: right away outside a match, otherwise at the start of the next round.
function queuePlayer(game, slot) {
  if (!game.match) addPlayer(game, slot)
  else if (!game.joining.includes(slot) && !playerInSlot(game, slot)) game.joining.push(slot)
}

// Practice: n dummies in slots 1..n.
function setDummies(game, n) {
  for (const p of game.players.filter(p => p.isDummy)) removePlayer(game, p.index)
  for (let slot = 1; slot <= n && slot < MAX_PLAYERS; slot++) if (!playerInSlot(game, slot)) addPlayer(game, slot, { dummy: true })
}

// Swap the level: platforms, pitchforks, scarecrows, patches and spawn points (bales come with resetRound).
function loadMap(game, id) {
  if (!MAPS[id]) id = 'patch'
  const map = MAPS[id]
  for (const body of game.mapBodies) game.world.destroyBody(body)
  game.mapBodies = map.platforms.map(p => {
    const body = game.world.createBody({ type: 'static', position: new Vec2(p.x, p.y) })
    body.createFixture(new planck.Box(p.w / 2, p.h / 2), { friction: 0.8 })
    body.setUserData({ kind: 'platform', ...p })
    return body
  })
  for (const sp of map.spikes) game.mapBodies.push(buildPitchforks(game, sp))
  game.scythes = map.scythes.map(def => ({ def, body: buildScythe(game, def) }))
  game.mapBodies.push(...game.scythes.map(sc => sc.body))
  game.movers = map.movers.map(def => ({ def, body: buildMover(game, def) }))
  game.mapBodies.push(...game.movers.map(m => m.body))
  game.map = id
  game.patches = createPatches(map)
  for (const p of game.players) p.spawn = spawnFor(map, p.index)
}

const currentMap = game => mapDef(game.map)

// Fresh start: (the chosen map), everyone back at their spawn with empty hands, bales rebuilt,
// patches almost ripe.
function resetRound(game) {
  if (game.map !== game.mapChoice) loadMap(game, game.mapChoice)
  for (const pk of game.pumpkins) game.world.destroyBody(pk.body)
  game.pumpkins = []
  resetBales(game)
  game.roundTime = 0
  for (const sc of game.scythes) sc.body.setTransform(new Vec2(sc.def.x, sc.def.y), SCYTHE_START)
  game.moverTime = 0
  for (const m of game.movers) { m.body.setTransform(new Vec2(m.def.x, m.def.y), 0); m.body.setLinearVelocity(new Vec2(0, 0)) }
  for (const p of game.players) p.respawn()
  resetPatches(game)
}

function stepGame(game, inputs) {
  game.time += CONFIG.dt                  // real time (also the network clock)
  const dt = CONFIG.dt * game.timeScale   // game time (slower during slow motion)
  game.roundTime += dt
  // being carried to the next map: you can aim but not move or attack
  if (game.transition) inputs = inputs.map(i => ({ ...emptyInput(), aimX: i.aimX, aimY: i.aimY }))
  for (const p of game.players) p.update(inputs[p.index] || emptyInput(), dt, game)   // (inputs by slot)
  updateTransition(game, CONFIG.dt)
  for (const sc of game.scythes) sc.body.setAngularVelocity(-2 * Math.PI / (sc.def.turnTime || CONFIG.level.scytheTurnTime))   // clockwise
  updateMovers(game, dt)
  game.world.step(dt, 10, 8)
  handlePumpkinContacts(game)
  updatePumpkins(game, dt)
  updateHazards(game, dt)
  updateBales(game, dt)
  updatePatches(game, dt)
  for (const p of game.players) p.checkDeath(dt, game)
  updateMatch(game, CONFIG.dt)
}

// ---------------------------------------------------------------------
// MAP TRANSITION — the camera pans left onto the next map while each player is
// picked up (dangling) and carried from where they were to their new spawn.
// ---------------------------------------------------------------------
const MAP_SHIFT = CONFIG.view.w   // during a pan, the old map sits one screen to the left
const ease = t => t * t * (3 - 2 * t)
const transitionCamera = t => -MAP_SHIFT * (1 - ease(t))   // camera x (0 = the new map fills the screen)

function startTransition(game, nextMap) {
  const from = game.map
  const oldMap = from ? mapDef(from) : null
  // anyone waiting to join comes in now (standing at their spawn in the old map)
  for (const slot of game.joining) addPlayer(game, slot)
  game.joining = []
  // where each player gets picked up (by slot): where they are (in the old map's frame), or above
  // their old spawn if they fell off
  const starts = {}
  for (const p of game.players) {
    const c = p.torso.getPosition(), old = oldMap ? spawnFor(oldMap, p.index) : p.spawn
    const onScreen = !p.dead && c.x > -1 && c.x < MAP_SHIFT + 1 && c.y > -1 && c.y < CONFIG.view.h + 1
    starts[p.index] = onScreen ? { x: c.x, y: c.y } : { x: old.x, y: old.y + 3 }
  }
  game.mapChoice = nextMap
  resetRound(game)
  game.timeScale = 1
  if (!from) return   // nothing to pan from
  game.transition = { from, elapsed: 0, duration: CONFIG.match.transitionTime, starts }
  game.players.forEach(p => {
    const c = p.torso.getPosition(), dx = starts[p.index].x - MAP_SHIFT - c.x, dy = starts[p.index].y - c.y
    for (const part of p.parts) {
      const q = part.body.getPosition()
      part.body.setTransform(new Vec2(q.x + dx, q.y + dy), part.body.getAngle())
    }
    p.stun(game.transition.duration + 0.05)   // limp: dangling while carried
    p.setGhost(true)                          // passes through platforms, scythes... on the way
  })
}

function updateTransition(game, dt) {
  const tr = game.transition
  if (!tr) return
  tr.elapsed += dt
  const t = Math.min(1, tr.elapsed / tr.duration), e = ease(t)
  game.players.forEach(p => {
    // carried by the torso along an arc; moving with the camera, so on screen they travel from
    // where they were straight to their spawn
    const from = tr.starts[p.index]
    if (!from) return   // (arrived during the pan)
    const to = { x: p.spawn.x, y: p.spawn.y + CONFIG.player.hoverHeight + BODY.torsoLen / 2 }
    const tx = lerp(from.x - MAP_SHIFT, to.x, e), ty = lerp(from.y, to.y, e) + Math.sin(Math.PI * t) * 3
    const c = p.torso.getPosition()
    p.torso.setLinearVelocity(new Vec2((tx - c.x) * 12, (ty - c.y) * 12))
    p.torso.setAngularVelocity(-wrapAngle(p.torso.getAngle()) * 8)
  })
  if (t >= 1) {   // set down: the round has started
    game.transition = null
    for (const p of game.players) {
      p.stunTimer = 0
      p.setGhost(false)
    }
  }
}

// =====================================================================
// PLAYER (active ragdoll)
//
// The body is real physics (limbs joined by hinges), but while you're in
// control three "cheats" keep it standing:
//   1. a hover spring pushes the pelvis up to standing height
//   2. a torque keeps the torso upright
//   3. joint motors pose the limbs (walk cycle, arms aiming)
// Getting hit turns these off for a moment, so the body goes limp.
// =====================================================================
class Player {
  constructor(world, opts) {
    this.world = world
    this.index = opts.index
    this.name = opts.name
    this.isDummy = false
    this.color = opts.color
    this.spawn = opts.spawn
    this.group = -(opts.index + 1)   // same negative group = limbs never collide with each other
    this.facing = 1
    this.aim = { x: this.spawn.x + 5, y: this.spawn.y + 1.5 }

    this.stunTimer = 0
    this.sinceStun = 99
    this.coyote = 0
    this.jumpBufferTimer = 0
    this.jumpLock = 0
    this.grounded = false
    this.groundDist = null
    this.groundVel = null   // the moving platform's velocity while standing on one
    this.walkPhase = 0
    this.charging = false
    this.charge = 0
    this.throwCooldown = 0
    this.punchTimer = 0           // > 0 while a jab is out
    this.punchCooldown = 0
    this.punchLanded = false      // each jab hits at most once
    this.punchDir = { x: 1, y: 0 }
    this.punchArm = 'L'           // alternates L / R each punch
    this.staggerMeter = 0         // recent damage; reaching CONFIG.damage.staggerAt knocks you down
    this.sinceHit = 99
    this.shoveTimer = 0           // got hit but not staggered: no walking control for a moment
    this.damageTaken = 0          // total this round
    this.health = CONFIG.player.maxHealth
    this.ko = false               // knocked out: limp until the next round
    this.held = null              // { typeName, power, ripeness, ammo?, blocks? } while holding a pumpkin
    this.sprayTimer = 0           // Seed Spitter: time until the next seed
    this.frozenTimer = 0          // Frost: stiff as a statue
    this.gluedTimer = 0           // Splat Pie: stuck to the floor
    this.pendingGlue = 0          // ...hit in the air: sticks when you land
    this.floatTimer = 0           // Balloon: floating helplessly upward
    this.fireTimer = 0.2          // bonfire damage ticks
    this.hopCooldown = 0          // bonfire pop-out
    this.reviveTimer = 0          // practice: back up after a hazard KO
    this.harvestTarget = null     // the patch we're pulling on
    this.harvestProgress = 0      // 0..1
    this.grapple = null           // Vine stuck in the level: { body, local, time, speed, from, best, stall } while reeling in
    this.dead = false
    this.respawnTimer = 0
    this.prev = emptyInput()
    this.debugRays = []

    this.build()
  }

  build() {
    const { x, y } = this.spawn
    const B = BODY
    const pelvisY = y + CONFIG.player.hoverHeight
    const neckY = pelvisY + B.torsoLen
    const shoulderY = neckY - 0.04
    this.shoulderLocalY = B.torsoLen / 2 - 0.04
    this.parts = []

    const addPart = (name, body, halfLen) => {
      body.setUserData({ kind: 'player', player: this, part: name })
      const pos = body.getPosition()
      this.parts.push({ name, body, halfLen, restX: pos.x - x, restY: pos.y - y })
      return body
    }
    const fixtureDef = { density: B.density, friction: 0.3, filterGroupIndex: this.group }
    const makeLimb = (name, topY, len) => {
      const body = this.world.createBody({ type: 'dynamic', position: new Vec2(x, topY - len / 2), angularDamping: 1 })
      body.createFixture(new planck.Box(B.limbHalfW, len / 2), fixtureDef)
      return addPart(name, body, len / 2)
    }
    const hinge = (a, b, anchorY, limit) => {
      const def = { enableMotor: true, maxMotorTorque: 1, motorSpeed: 0 }
      if (limit != null) Object.assign(def, { enableLimit: true, lowerAngle: -limit, upperAngle: limit })
      return this.world.createJoint(new planck.RevoluteJoint(def, a, b, new Vec2(x, anchorY)))
    }

    // Parts are created in the order listed in PART_NAMES (snapshots rely on it).
    this.torso = this.world.createBody({ type: 'dynamic', position: new Vec2(x, pelvisY + B.torsoLen / 2) })
    this.torso.createFixture(new planck.Box(B.torsoHalfW, B.torsoLen / 2), fixtureDef)
    addPart('torso', this.torso, B.torsoLen / 2)

    this.head = this.world.createBody({ type: 'dynamic', position: new Vec2(x, neckY + B.headR + 0.03) })
    this.head.createFixture(new planck.Circle(B.headR), fixtureDef)
    addPart('head', this.head, 0)

    const thighL = makeLimb('thighL', pelvisY, B.legSeg)
    const thighR = makeLimb('thighR', pelvisY, B.legSeg)
    const shinL = makeLimb('shinL', pelvisY - B.legSeg, B.legSeg)
    const shinR = makeLimb('shinR', pelvisY - B.legSeg, B.legSeg)
    const armL = makeLimb('armL', shoulderY, B.armSeg)
    const armR = makeLimb('armR', shoulderY, B.armSeg)
    this.forearmL = makeLimb('forearmL', shoulderY - B.armSeg, B.armSeg)
    this.forearmR = makeLimb('forearmR', shoulderY - B.armSeg, B.armSeg)

    this.joints = {
      neck: hinge(this.torso, this.head, neckY, 0.6),
      hipL: hinge(this.torso, thighL, pelvisY, 1.9),
      hipR: hinge(this.torso, thighR, pelvisY, 1.9),
      kneeL: hinge(thighL, shinL, pelvisY - B.legSeg, 2.3),
      kneeR: hinge(thighR, shinR, pelvisY - B.legSeg, 2.3),
      shoulderL: hinge(this.torso, armL, shoulderY, null),
      shoulderR: hinge(this.torso, armR, shoulderY, null),
      elbowL: hinge(armL, this.forearmL, shoulderY - B.armSeg, 2.5),
      elbowR: hinge(armR, this.forearmR, shoulderY - B.armSeg, 2.5),
    }
    this.mass = this.parts.reduce((m, p) => m + p.body.getMass(), 0)
  }

  get stunned() { return this.stunTimer > 0 }
  get out() { return this.ko || this.dead }   // out of the round

  // Ghost: passes through everything (while being carried across a map during a pan).
  setGhost(ghost) {
    for (const part of this.parts) {
      for (let f = part.body.getFixtureList(); f; f = f.getNext()) f.setFilterMaskBits(ghost ? 0 : 0xFFFF)
    }
  }

  // Take damage at world point `pos`. Hits add up on the stagger meter (it drains if you go a
  // moment without being hit); reaching CONFIG.damage.staggerAt knocks you into a ragdoll.
  // At 0 health you're knocked out (in practice you just refill). Returns true if staggered/KO'd.
  takeHit(game, damage, stunTime, pos) {
    if (this.ko) return false   // a knocked-out body can be knocked around but takes no damage
    damage = Math.max(1, Math.round(Math.min(damage, this.health)))
    this.health = Math.max(0, this.health - damage)
    this.damageTaken += damage
    game.events.push({ type: 'damage', x: r3(pos.x), y: r3(pos.y + 0.3), amount: damage })
    if (this.health <= 0) {
      const head = this.head.getPosition()
      game.events.push({ type: 'ko', x: r3(head.x), y: r3(head.y + 0.6) })
      if (!game.match) {
        this.health = CONFIG.player.maxHealth   // practice: nobody really dies
      } else {
        this.knockOut()
        return true
      }
    }
    this.staggerMeter += damage
    this.sinceHit = 0
    if (this.staggerMeter >= CONFIG.damage.staggerAt) {
      this.staggerMeter = 0
      this.stun(stunTime)
      return true
    }
    this.shoveTimer = CONFIG.damage.shoveTime
    return false
  }

  stun(seconds) {
    this.stunTimer = Math.max(this.stunTimer, seconds)
    this.charging = false
    this.punchTimer = 0
  }

  freeze(seconds) {
    this.frozenTimer = Math.max(this.frozenTimer, seconds)
    this.charging = false
    this.punchTimer = 0
  }

  glue(seconds) {
    if (this.grounded) this.gluedTimer = Math.max(this.gluedTimer, seconds)
    else this.pendingGlue = Math.max(this.pendingGlue, seconds)
  }

  float(seconds) {
    this.floatTimer = Math.max(this.floatTimer, seconds)
    this.stun(seconds)
  }

  // Held-pumpkin effects on movement (Big Gourd is heavy, Balloon makes you floaty).
  get carry() { return (this.held && PUMPKIN_TYPES[this.held.typeName].carry) || {} }

  // The front hand (the one closest to where you're aiming) holds the pumpkin.
  handPosition() {
    const forearm = this.facing > 0 ? this.forearmR : this.forearmL
    return forearm.getWorldPoint(new Vec2(0, -BODY.armSeg / 2))
  }

  update(input, dt, game) {
    if (this.dead) return
    const C = CONFIG.player
    const torso = this.torso
    const pos = torso.getPosition()
    const vel = torso.getLinearVelocity()
    const angle = wrapAngle(torso.getAngle())

    // --- timers ---
    this.throwCooldown = Math.max(0, this.throwCooldown - dt)
    this.punchCooldown = Math.max(0, this.punchCooldown - dt)
    this.shoveTimer = Math.max(0, this.shoveTimer - dt)
    this.sinceHit += dt
    if (this.sinceHit > CONFIG.damage.drainDelay) this.staggerMeter = Math.max(0, this.staggerMeter - CONFIG.damage.drainRate * dt)
    this.punchTimer = Math.max(0, this.punchTimer - dt)
    this.frozenTimer = Math.max(0, this.frozenTimer - dt)
    this.gluedTimer = Math.max(0, this.gluedTimer - dt)
    this.floatTimer = Math.max(0, this.floatTimer - dt)
    this.jumpLock = Math.max(0, this.jumpLock - dt)
    this.jumpBufferTimer = Math.max(0, this.jumpBufferTimer - dt)
    if (this.stunTimer > 0) {
      this.stunTimer -= dt
      this.sinceStun = 0
    } else {
      this.sinceStun += dt
    }
    if (input.ragdoll && !this.prev.ragdoll) this.stun(1.5)
    const frozen = this.frozenTimer > 0
    const stunned = this.stunned || frozen   // can't act
    const control = stunned ? 0 : Math.min(1, this.sinceStun / C.recoverTime)
    const carry = this.carry

    this.aim.x = input.aimX
    this.aim.y = input.aimY
    this.facing = input.aimX >= pos.x ? 1 : -1

    // --- ground check ---
    this.senseGround()
    this.coyote = this.grounded ? C.coyoteTime : Math.max(0, this.coyote - dt)
    if (this.pendingGlue > 0 && this.grounded) { this.gluedTimer = this.pendingGlue; this.pendingGlue = 0 }

    // --- 1. hover spring ---
    if (!stunned && this.groundDist !== null && this.jumpLock <= 0) {
      const err = C.hoverHeight - this.groundDist
      const accel = clamp(CONFIG.gravity + C.hoverK * err - C.hoverD * (vel.y - (this.groundVel ? this.groundVel.y : 0)), 0, 5 * CONFIG.gravity)
      const uprightness = 0.3 + 0.7 * Math.max(0, Math.cos(angle))
      torso.applyForceToCenter(new Vec2(0, accel * this.mass * control * uprightness), true)
    }

    // --- 2. stay upright ---
    if (!stunned) {
      const torque = C.uprightInertia * (C.uprightK * -angle - C.uprightD * torso.getAngularVelocity())
      torso.applyTorque(clamp(torque, -C.uprightMaxTorque, C.uprightMaxTorque) * control, true)
    }

    // --- movement (not while staggered or glued, or for a moment after a shove) ---
    if (!stunned && this.shoveTimer <= 0 && this.gluedTimer <= 0) {
      const dir = (input.right ? 1 : 0) - (input.left ? 1 : 0)
      const maxAccel = this.grounded ? C.groundAccel : C.airAccel
      let targetVx = dir * C.moveSpeed * (carry.speed ?? 1) + (this.grounded && this.groundVel ? this.groundVel.x : 0)
      // Walking into a hay bale pushes it: it gets a shove, and we walk along at its speed instead
      // of through it. (Our legs alone would just fold and let us slide up over it.)
      const bale = dir && this.grounded ? this.baleAhead(game, dir, vel.x) : null
      if (bale) {
        const L = CONFIG.level, bv = bale.body.getLinearVelocity().x
        bale.body.applyForceToCenter(new Vec2(dir * L.balePushForce * clamp(1 - bv * dir / L.balePushSpeed, 0, 1), 0), true)
        targetVx = dir > 0 ? Math.min(targetVx, bv) : Math.max(targetVx, bv)
      }
      let ax = clamp((targetVx - vel.x) * 10, -maxAccel, maxAccel)
      if (!this.grounded && dir === 0) ax *= 0.15   // keep momentum in the air
      torso.applyForceToCenter(new Vec2(ax * this.mass * control, 0), true)
    }

    // glued: held in place on the floor
    if (this.gluedTimer > 0 && this.grounded) {
      for (const p of this.parts) {
        const v = p.body.getLinearVelocity()
        p.body.setLinearVelocity(new Vec2(v.x * 0.5, v.y))
      }
    }

    // floating (hit by a Balloon): drift helplessly upward
    if (this.floatTimer > 0) {
      const lift = CONFIG.gravity + (1.8 - vel.y) * 4
      for (const p of this.parts) p.body.applyForceToCenter(new Vec2(0, p.body.getMass() * lift), true)
    }

    // gliding (holding a Balloon): fall only about 3-4 m/s
    if (carry.glide && !stunned && vel.y < -3) {
      torso.applyForceToCenter(new Vec2(0, this.mass * Math.min(1.5 * CONFIG.gravity, (-3 - vel.y) * 40)), true)
    }

    // --- reeled in by a Vine (overrides walking and the hover spring) ---
    this.updateGrapple(input, dt, game, stunned)

    // --- jump ---
    if (input.jump && !this.prev.jump) this.jumpBufferTimer = C.jumpBuffer
    if (!stunned && this.gluedTimer <= 0 && this.jumpBufferTimer > 0 && this.coyote > 0) {
      for (const p of this.parts) {
        const v = p.body.getLinearVelocity()
        p.body.setLinearVelocity(new Vec2(v.x, C.jumpSpeed * (carry.jump ?? 1)))
      }
      this.coyote = 0
      this.jumpBufferTimer = 0
      this.jumpLock = 0.2
    }

    // --- harvesting ---
    this.updateHarvest(input, dt, game, stunned)

    // --- 3. pose the limbs ---
    this.poseLimbs(dt, vel, control)

    // --- throwing (or punching with empty hands) ---
    if (!stunned) {
      const clicked = input.throw && !this.prev.throw
      const heldType = this.held && PUMPKIN_TYPES[this.held.typeName]
      if (heldType && heldType.throwMode === 'spray') {
        this.sprayTimer -= dt
        if (input.throw && this.sprayTimer <= 0) this.fireSeed(game)
      } else if (clicked && this.held && this.throwCooldown <= 0) {
        this.charging = true
        this.charge = 0
      } else if (clicked && !this.held && !this.harvestTarget && this.punchCooldown <= 0) {
        this.startPunch(game)
      }
      if (this.charging) {
        this.charge = Math.min(1, this.charge + dt / CONFIG.throw.chargeTime)
        if (!input.throw) this.throwPumpkin(game)
      }
      if (this.punchTimer > 0 && !this.punchLanded) this.checkPunchHit(game)
    }

    this.prev = { ...input }
  }

  // Vine stuck in `body` at `point`: start reeling in (the spot moves along with a moving platform).
  startGrapple(body, point) {
    const c = this.torso.getPosition(), v = this.torso.getLinearVelocity()
    const dx = point.x - c.x, dy = point.y - c.y, d = Math.hypot(dx, dy) || 1e-6
    const local = body.getLocalPoint(point)
    this.grapple = {
      body, local: new Vec2(local.x, local.y), time: 0, from: d, best: d, stall: 0,
      speed: Math.max(0, (v.x * dx + v.y * dy) / d),   // (picks up from how fast we're already going that way)
    }
  }

  // Where the Vine is stuck right now (world point), or null.
  grapplePoint() {
    return this.grapple ? this.grapple.body.getWorldPoint(this.grapple.local) : null
  }

  // Reel in along a straight line toward the spot. Lets go on arrival (see grapple.reach / stopAt),
  // when something's in the way, after grapple.maxTime, on a jump press, or when hit/stunned.
  updateGrapple(input, dt, game, stunned) {
    const g = this.grapple
    if (!g) return
    const G = PUMPKIN_TYPES.vine.grapple
    const a = this.grapplePoint(), c = this.torso.getPosition()
    const dx = a.x - c.x, dy = a.y - c.y, d = Math.hypot(dx, dy) || 1e-6
    g.time += dt
    if (d < g.best - 0.05) { g.best = d; g.stall = 0 } else g.stall += dt   // (not getting closer: blocked)
    const arrived = d <= Math.max(G.stopAt, g.from * (1 - G.reach))
    if (stunned || game.transition) { this.grapple = null; return }
    if (arrived || g.stall > 0.15 || g.time >= G.maxTime || (input.jump && !this.prev.jump)) {
      this.grapple = null
      const v = this.torso.getLinearVelocity()
      const out = new Vec2(v.x * G.keep, v.y * G.keep + G.hop)
      for (const p of this.parts) p.body.setLinearVelocity(out)
      this.jumpLock = 0.2   // (so the hover spring doesn't eat the hop)
      return
    }
    g.speed = Math.min(G.speed, g.speed + G.accel * dt)
    const speed = Math.min(g.speed, d / dt)   // (never past the spot in one step)
    const v = new Vec2(dx / d * speed, dy / d * speed)
    for (const p of this.parts) p.body.setLinearVelocity(v)
    this.jumpLock = Math.max(this.jumpLock, 0.1)   // hover spring off while reeling
  }

  startPunch(game) {
    const P = CONFIG.punch
    const shoulder = this.torso.getWorldPoint(new Vec2(0, this.shoulderLocalY))
    const dx = this.aim.x - shoulder.x, dy = this.aim.y - shoulder.y
    const d = Math.hypot(dx, dy) || 1
    this.punchDir = { x: dx / d, y: dy / d }
    this.punchArm = this.punchArm === 'L' ? 'R' : 'L'
    this.punchTimer = P.time
    this.punchCooldown = P.cooldown
    this.punchLanded = false
    // small lunge in the punch direction (sideways only, so you can't fly by punching up);
    // not into a hay bale right in front of you, or you'd end up climbing onto it
    if (!this.baleAhead(game, Math.sign(dx), 0)) {
      this.torso.applyLinearImpulse(new Vec2(Math.sign(dx) * P.lunge * this.mass, 0), this.torso.getWorldCenter(), true)
    }
  }

  // Does the punching fist touch any part of another player?
  checkPunchHit(game) {
    const P = CONFIG.punch
    const forearm = this.punchArm === 'L' ? this.forearmL : this.forearmR
    const fist = forearm.getWorldPoint(new Vec2(0, -BODY.armSeg / 2))
    for (const other of game.players) {
      if (other === this || other.dead) continue
      // a carried Big Gourd sits in front of the body, so it gets hit first
      if (tryBlock(game, other, fist, P.reach, this.punchDir)) { this.punchLanded = true; return }
      for (const part of other.parts) {
        const radius = part.name === 'head' ? BODY.headR : part.name === 'torso' ? BODY.torsoHalfW : BODY.limbHalfW
        const a = part.body.getWorldPoint(new Vec2(0, part.halfLen))
        const b = part.body.getWorldPoint(new Vec2(0, -part.halfLen))
        if (distToSegment(fist, a, b) < radius + P.reach) {
          this.punchLanded = true
          applyHit(game, other, part.body, this.punchDir.x, this.punchDir.y, P.knockback, P.damage, P.stun)
          game.events.push({ type: 'hit', x: r3(fist.x), y: r3(fist.y) })
          return
        }
      }
    }
    const bale = baleAt(game, fist, P.reach)
    if (bale) {
      this.punchLanded = true
      damageBale(game, bale, P.damage * CONFIG.level.balePunchMultiplier)
      const m = bale.body.getMass() * 1.5
      bale.body.applyLinearImpulse(new Vec2(this.punchDir.x * m, this.punchDir.y * m), fist, true)
      game.events.push({ type: 'hit', x: r3(fist.x), y: r3(fist.y) })
    }
  }

  // Instant KO from a hazard. Out for the round in a match; in practice you get back up.
  kill(game) {
    if (this.out) return
    this.health = 0
    const head = this.head.getPosition()
    game.events.push({ type: 'ko', x: r3(head.x), y: r3(head.y + 0.6) })
    this.knockOut()
    if (!game.match) this.reviveTimer = 1.2
  }

  knockOut() {
    this.ko = true
    this.stunTimer = Infinity   // limp for the rest of the round
    this.held = null
    this.charging = false
    this.harvestTarget = null
    this.harvestProgress = 0
  }

  // A hay bale right in front of us at about knee height, if we're walking into one.
  baleAhead(game, dir, vx) {
    const pelvis = this.torso.getWorldPoint(new Vec2(0, -BODY.torsoLen / 2))
    const reach = 0.22 + Math.abs(vx) * 0.04   // look a bit further ahead when moving fast
    return baleAt(game, { x: pelvis.x + dir * reach, y: pelvis.y - 0.55 }, 0)
  }

  // Hold harvest next to a patch with empty hands to pick its pumpkin.
  updateHarvest(input, dt, game, stunned) {
    const target = !stunned && input.harvest && !this.held && !this.charging ? this.findPatch(game) : null
    if (target !== this.harvestTarget) this.harvestProgress = 0   // walked away, let go, or switched patch
    this.harvestTarget = target
    if (!target) return
    this.harvestProgress += dt / CONFIG.patch.harvestTime
    if (this.harvestProgress >= 1) {
      const type = PUMPKIN_TYPES[target.typeName]
      this.held = { typeName: target.typeName, power: patchPower(target), ripeness: patchRipeness(target), ammo: type.ammo, blocks: 0 }
      this.sprayTimer = 0
      emptyPatch(target)
      this.harvestTarget = null
      this.harvestProgress = 0
    }
  }

  findPatch(game) {
    const pelvis = this.torso.getWorldPoint(new Vec2(0, -BODY.torsoLen / 2))
    let best = null
    let bestDx = CONFIG.patch.reach
    for (const patch of game.patches) {
      const dx = Math.abs(pelvis.x - patch.x), dy = pelvis.y - patch.y
      if (canHarvest(patch) && dx < bestDx && dy > 0 && dy < 1.6) { best = patch; bestDx = dx }
    }
    return best
  }

  senseGround() {
    const C = CONFIG.player
    const pelvis = this.torso.getWorldPoint(new Vec2(0, -BODY.torsoLen / 2))
    const len = C.hoverHeight + C.hoverReach
    let best = null, bestBody = null
    this.debugRays = []
    // (two rays, kept inside the body's width: wider and you'd hop up onto any hay bale you walk into)
    for (const ox of [-0.05, 0.05]) {
      const from = new Vec2(pelvis.x + ox, pelvis.y)
      const to = new Vec2(pelvis.x + ox, pelvis.y - len)
      let hit = null, hitBody = null
      this.world.rayCast(from, to, (fixture, point, normal, fraction) => {
        const ud = fixture.getBody().getUserData()
        // ignore all players (another player's body under you isn't ground; the hover spring
        // would launch you), pumpkins, and hazards (you'd hover over pitchforks instead of landing on them)
        if (ud && (ud.kind === 'player' || ud.kind === 'pumpkin' || ud.kind === 'hazard')) return -1
        hit = fraction
        hitBody = fixture.getBody()
        return fraction
      })
      if (hit !== null && (best === null || hit * len < best)) { best = hit * len; bestBody = hitBody }
      this.debugRays.push({ from, to, hit: hit !== null })
    }
    this.groundDist = best
    this.grounded = best !== null && best < C.hoverHeight + 0.15
    // standing on a moving platform: we move with it (we hover, so friction can't carry us)
    const ud = bestBody && bestBody.getUserData()
    this.groundVel = ud && ud.mover ? bestBody.getLinearVelocity() : null
  }

  poseLimbs(dt, vel, control) {
    const C = CONFIG.player
    const f = this.facing
    const J = this.joints
    let hipL, hipR, kneeL, kneeR
    const speed = Math.abs(vel.x)
    const amt = this.grounded ? Math.min(1, speed / C.moveSpeed) : 0   // how much we're walking (0..1)

    if (this.grounded) {
      this.walkPhase += dt * speed * 2.8
      if (amt < 0.08) {
        hipL = 0.12; hipR = -0.12
        kneeL = kneeR = -0.08 * f
      } else {
        const a = this.walkPhase, b = this.walkPhase + Math.PI
        hipL = 0.75 * amt * Math.sin(a)
        hipR = 0.75 * amt * Math.sin(b)
        kneeL = -f * (0.1 + 1.1 * amt * Math.max(0, Math.cos(a)))
        kneeR = -f * (0.1 + 1.1 * amt * Math.max(0, Math.cos(b)))
      }
    } else {
      hipL = f * 0.55; hipR = -f * 0.25
      kneeL = -f * 0.9; kneeR = -f * 0.35
    }

    // Both arms point at the aim, like holding the pumpkin with two hands
    // (or reach down to the pumpkin we're harvesting).
    const shoulder = this.torso.getWorldPoint(new Vec2(0, this.shoulderLocalY))
    const target = this.harvestTarget ? patchPumpkin(this.harvestTarget) : this.aim
    const aimAngle = Math.atan2(target.x - shoulder.x, -(target.y - shoulder.y))
    const armTarget = aimAngle - this.torso.getAngle()
    const [frontShoulder, backShoulder] = f > 0 ? [J.shoulderR, J.shoulderL] : [J.shoulderL, J.shoulderR]

    const legT = lerp(C.limpTorque, C.legTorque, control)
    const armT = lerp(C.limpTorque, C.armTorque, control)
    const neckT = lerp(C.limpTorque, C.neckTorque, control)
    this.drive(J.hipL, hipL, legT)
    this.drive(J.hipR, hipR, legT)
    this.drive(J.kneeL, kneeL, legT)
    this.drive(J.kneeR, kneeR, legT)
    const [frontElbow, backElbow] = f > 0 ? [J.elbowR, J.elbowL] : [J.elbowL, J.elbowR]
    if (this.held || this.harvestTarget) {
      // straight arms: holding the pumpkin with both hands / reaching for one
      this.drive(frontShoulder, armTarget, armT)
      this.drive(backShoulder, armTarget - 0.15 * f, armT)
      this.drive(frontElbow, 0, armT)
      this.drive(backElbow, 0, armT)
    } else {
      // Arms relaxed at the sides, swinging opposite the legs while walking
      // (thrown out a bit in the air). A punch swings one arm straight at the aim.
      const front = f > 0 ? 'R' : 'L', back = f > 0 ? 'L' : 'R'
      const rest = { L: -0.6 * amt * Math.sin(this.walkPhase), R: -0.6 * amt * Math.sin(this.walkPhase + Math.PI) }
      if (!this.grounded) { rest[front] = 0.8 * f; rest[back] = -0.5 * f }
      const elbowBend = f * (this.grounded ? 0.2 + 0.4 * amt : 0.5)
      for (const side of ['L', 'R']) {
        const jab = this.punchTimer > 0 && this.punchArm === side
        const t = jab ? armT * 3 : armT
        this.drive(J['shoulder' + side], jab ? armTarget : rest[side], t)
        this.drive(J['elbow' + side], jab ? 0 : elbowBend, t)
      }
    }
    this.drive(J.neck, 0, neckT)
  }

  // Joint motor as a spring: spin toward the target angle, with limited strength.
  // While stunned, the motor just resists motion a little (floppy, not chaotic).
  drive(joint, target, torque) {
    if (this.frozenTimer > 0) {   // frozen: every joint locks where it is (a stiff statue)
      joint.setMotorSpeed(0)
      joint.setMaxMotorTorque(400)
      return
    }
    // Joints with limits (elbows, knees...) must turn the direct way; wrapping the angle could
    // send them "the short way round" straight into their limit, where they'd get stuck.
    const error = joint.isLimitEnabled() ? target - joint.getJointAngle() : wrapAngle(target - joint.getJointAngle())
    const speed = this.stunned ? 0 : CONFIG.player.jointK * error
    joint.setMotorSpeed(speed)
    joint.setMaxMotorTorque(torque)
  }

  throwPumpkin(game) {
    const T = CONFIG.throw
    const hand = this.handPosition()
    const shoulder = this.torso.getWorldPoint(new Vec2(0, this.shoulderLocalY))
    let dx = this.aim.x - shoulder.x, dy = this.aim.y - shoulder.y
    const d = Math.hypot(dx, dy) || 1
    dx /= d; dy /= d
    const type = PUMPKIN_TYPES[this.held.typeName]
    const [lo, hi] = type.throwMode === 'lob' ? type.lobSpeed : type.throwSpeed ? [type.throwSpeed.min, type.throwSpeed.max] : [T.minSpeed, T.maxSpeed]
    const speed = lerp(lo, hi, this.charge)
    const tv = this.torso.getLinearVelocity()
    const pos = new Vec2(hand.x + dx * 0.15, hand.y + dy * 0.15)
    spawnPumpkin(game, this.held.typeName, pos, new Vec2(dx * speed + tv.x * 0.5, dy * speed + tv.y * 0.5), this, this.held)
    this.held = null
    this.charging = false
    this.charge = 0
    this.throwCooldown = T.cooldown
  }

  // Seed Spitter: one seed toward the aim (a little spread); the pumpkin is used up when empty.
  fireSeed(game) {
    const type = PUMPKIN_TYPES[this.held.typeName]
    const hand = this.handPosition()
    const shoulder = this.torso.getWorldPoint(new Vec2(0, this.shoulderLocalY))
    const a = Math.atan2(this.aim.y - shoulder.y, this.aim.x - shoulder.x) + (Math.random() - 0.5) * 0.12
    const dx = Math.cos(a), dy = Math.sin(a)
    const tv = this.torso.getLinearVelocity()
    const pos = new Vec2(hand.x + dx * 0.15, hand.y + dy * 0.15)
    spawnPumpkin(game, 'seed', pos, new Vec2(dx * type.seedSpeed + tv.x * 0.3, dy * type.seedSpeed + tv.y * 0.3), this, this.held)
    this.sprayTimer = type.fireInterval
    if (--this.held.ammo <= 0) this.held = null
  }

  checkDeath(dt, game) {
    if (!this.dead && this.torso.getPosition().y < CONFIG.killY) {
      this.dead = true
      this.respawnTimer = CONFIG.respawnTime
      this.held = null
      this.grapple = null
      this.charging = false
      if (game.match) this.health = 0
    }
    if (this.reviveTimer > 0) {
      this.reviveTimer -= dt
      if (this.reviveTimer <= 0) this.respawn()
    }
    if (this.dead && !game.match) {   // practice: come back; in a match you're out until the next round
      this.respawnTimer -= dt
      if (this.respawnTimer <= 0) this.respawn()
    }
  }

  respawn() {
    const { x, y } = this.spawn
    for (const p of this.parts) {
      p.body.setTransform(new Vec2(x + p.restX, y + p.restY), 0)
      p.body.setLinearVelocity(new Vec2(0, 0))
      p.body.setAngularVelocity(0)
      p.body.setAwake(true)
    }
    this.dead = false
    this.stunTimer = 0
    this.sinceStun = 99
    this.staggerMeter = 0
    this.shoveTimer = 0
    this.health = CONFIG.player.maxHealth
    this.ko = false
    this.damageTaken = 0
    this.charging = false
    this.punchTimer = 0
    this.held = null
    this.frozenTimer = 0
    this.gluedTimer = 0
    this.pendingGlue = 0
    this.floatTimer = 0
    this.reviveTimer = 0
    this.hopCooldown = 0
    this.grapple = null
    this.harvestTarget = null
    this.harvestProgress = 0
  }
}

// =====================================================================
// PUMPKINS
// =====================================================================
// quality: { power, ripeness } of the harvested pumpkin (full power if left out)
// group: collision group for the first 0.25 s (default: the thrower's, so it doesn't hit them on the way out)
function spawnPumpkin(game, typeName, pos, vel, owner, quality, group) {
  const type = PUMPKIN_TYPES[typeName]
  const body = game.world.createBody({ type: 'dynamic', position: pos, bullet: true, gravityScale: type.gravityScale ?? 1 })
  const fixture = body.createFixture(new planck.Circle(type.radius), {
    density: type.density, friction: type.friction ?? 0.4, restitution: type.restitution,
    filterGroupIndex: group ?? (owner ? owner.group : 0),
  })
  body.setLinearVelocity(vel)
  body.setAngularVelocity(owner ? -owner.facing * 8 : 0)
  const pumpkin = {
    id: game.nextPumpkinId++, typeName, type, body, fixture, owner, hits: 0, age: 0, broken: false,
    power: quality ? quality.power : 1,          // from how ripe it was when picked
    ripeness: quality ? quality.ripeness : 1,
    lastHit: {},                                 // player index → age of last hit (pass-through types)
  }
  body.setUserData({ kind: 'pumpkin', pumpkin })
  game.pumpkins.push(pumpkin)
  return pumpkin
}

function recordPumpkinContact(game, fixture, other) {
  const ud = fixture.getBody().getUserData()
  if (!ud || ud.kind !== 'pumpkin' || ud.pumpkin.broken) return
  const v = fixture.getBody().getLinearVelocity()   // still the velocity before impact
  game.contacts.push({ pumpkin: ud.pumpkin, other: other.getBody(), velocity: { x: v.x, y: v.y } })
}

function handlePumpkinContacts(game) {
  for (const c of game.contacts) {
    const p = c.pumpkin
    if (p.broken) continue
    const ud = c.other.getUserData()
    const hitPlayer = ud && ud.kind === 'player'
    if (hitPlayer) {
      const player = ud.player
      const pos = p.body.getPosition()
      if (tryBlock(game, player, pos, p.type.radius + 0.3, unit(c.velocity))) { breakPumpkin(game, p); continue }
      if (!p.type.breakOnPlayer) {   // passes through: don't hit the same player again right away
        const last = p.lastHit[player.index]
        if (last !== undefined && p.age - last < 0.4) continue
        p.lastHit[player.index] = p.age
      }
      if (p.type.onHitPlayer) p.type.onHitPlayer(game, p, player, c.other, c.velocity)
      else knockback(game, player, c.other, p, c.velocity)
    } else {
      p.hits++
      if (ud && ud.kind === 'bale') {
        const power = hitPower(p, c.velocity)
        damageBale(game, ud.bale, p.type.damage * power)
        shoveBale(ud.bale, unit(c.velocity), p.type.knockback * power)
        if (p.type.onHitBale) p.type.onHitBale(game, p, ud.bale, c.velocity)
      } else if (p.type.onHitWorld) p.type.onHitWorld(game, p, c.other)
    }
    if (p.hits >= p.type.breakAfterHits || (hitPlayer && p.type.breakOnPlayer)) breakPumpkin(game, p)
  }
  game.contacts.length = 0
}

// 0..1: how hard a pumpkin hits, from its impact speed and how ripe it was when picked.
function hitPower(pumpkin, vel) {
  const speed = Math.hypot(vel.x, vel.y)
  return clamp(speed / (pumpkin.type.refSpeed || CONFIG.throw.maxSpeed), 0.3, 1) * pumpkin.power
}

function knockback(game, player, hitBody, pumpkin, vel) {
  const speed = Math.hypot(vel.x, vel.y)
  if (speed < 0.5) return
  const t = pumpkin.type
  const power = hitPower(pumpkin, vel)
  applyHit(game, player, hitBody, vel.x / speed, vel.y / speed, t.knockback * power, t.damage * power, t.stun * power)
}

// Deal `damage` (which may stagger them for `stun` seconds) and push the player at `speed` m/s
// along (dx, dy). Hits too small to stagger only give a small shove.
function applyHit(game, player, hitBody, dx, dy, speed, damage, stun) {
  const staggered = player.takeHit(game, damage, stun, hitBody.getPosition())
  launch(player, hitBody, dx, dy, staggered ? speed : speed * CONFIG.damage.shoveScale)
}

// Push every part of a player (the part that got hit flies a bit more), tilted a bit upward
// so people get launched.
function launch(player, hitBody, dx, dy, speed) {
  dy += 0.35
  const d = Math.hypot(dx, dy) || 1
  dx /= d; dy /= d
  for (const part of player.parts) {
    const m = part.body.getMass() * (part.body === hitBody ? 1.6 : 1)
    part.body.applyLinearImpulse(new Vec2(dx * speed * m, dy * speed * m), part.body.getWorldCenter(), true)
  }
}

const unit = v => { const d = Math.hypot(v.x, v.y) || 1; return { x: v.x / d, y: v.y / d } }

function breakPumpkin(game, p) {
  if (p.broken) return
  p.broken = true
  const pos = p.body.getPosition()
  game.events.push({ type: 'splat', x: r3(pos.x), y: r3(pos.y), typeName: p.typeName, ripeness: p.ripeness, rot: 0 })
  if (p.type.onBreak) p.type.onBreak(game, p)
}

// Gone without a splat (a fizzled vine, a cluster that split): just a small puff.
function popPumpkin(game, p) {
  p.broken = true
  const pos = p.body.getPosition()
  game.events.push({ type: 'pop', x: r3(pos.x), y: r3(pos.y), color: p.type.color })
}

function updatePumpkins(game, dt) {
  for (const p of game.pumpkins) {   // (split clusters add pieces while we loop; that's fine)
    p.age += dt
    if (p.age > 0.25 && p.fixture.getFilterGroupIndex() !== 0) p.fixture.setFilterGroupIndex(0)
    if (p.body.getPosition().y < CONFIG.killY) p.broken = true
    if (p.broken) continue
    if (p.type.lifetime && p.age >= p.type.lifetime) {
      if (p.type.fizzle) popPumpkin(game, p)
      else breakPumpkin(game, p)
      continue
