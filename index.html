function createMenu(onAction) {
  const root = document.getElementById('menu')
  let screen = 'main'
  root.addEventListener('click', e => {
    const btn = e.target.closest('[data-act]')
    if (btn) { btn.blur(); onAction(btn.dataset.act) }
  })
  // match length block (on the Match Settings screen)
  for (const el of root.querySelectorAll('.match-settings')) {
    el.innerHTML = `<p class="label">Match Length</p>
      <div class="seg"><button data-act="mode-rounds">Rounds</button><button data-act="mode-wins">First To</button><button data-act="mode-endless">Endless</button></div>
      <div class="stepper"><button data-act="num-down">−</button><span data-text="match-num"></span><button data-act="num-up">+</button></div>`
  }
  // the logo: one span per letter so they can drop in one after another
  const LOGO = 'Gourd Wars', dropDelay = i => 0.1 + i * 0.06, DROP_TIME = 0.8   // (DROP_TIME: logo-drop's length)
  const landed = dropDelay(LOGO.length - 1) + DROP_TIME, SWAY_IN = 0.9   // (SWAY_IN: logo-sway-in's length)
  root.querySelector('.logo').innerHTML = `<span class="wobble" style="animation-delay:${landed}s, ${landed + SWAY_IN}s">` + [...LOGO].map((ch, i) =>
    ch === ' ' ? '<span class="gap"></span>' : `<span class="ch" style="animation-delay:${dropDelay(i)}s">${ch}</span>`).join('') + '</span>'
  // pumpkin spawn settings: one row per type, under column headings
  const rates = Object.keys(SPAWN_RATES)
  root.querySelector('.pumpkin-list').innerHTML = '<div class="pk-head"><span class="pk-name"></span><span>Enabled</span><span>Rarity</span></div>' + SPAWNABLE_TYPES.map(k => `
    <div class="pk-row" data-type="${k}">
      <span class="dot" style="background:${PUMPKIN_TYPES[k].color}"></span>
      <span class="pk-name">${PUMPKIN_TYPES[k].name}</span>
      <button class="pk-on" data-act="pk-toggle:${k}">On</button>
      <div class="seg">${rates.map(r => `<button data-act="pk-rate:${k}:${r}">${r[0].toUpperCase() + r.slice(1)}</button>`).join('')}</div>
    </div>`).join('')
  // map buttons (rebuilt whenever custom maps change); maps that can't be played yet are left out
  const buildMapButtons = () => {
    const ids = mapIds().filter(id => MAPS[id].playable !== false)
    const buttons = act => `<div class="map-grid">${ids.map(id => `<button data-act="${act}:${id}"></button>`).join('')}</div>`
    for (const el of root.querySelectorAll('.map-select')) el.innerHTML = `<p class="label">Practice Map</p>${buttons('map')}`
    for (const el of root.querySelectorAll('.map-rotation')) el.innerHTML = `<p class="label">Maps</p>${buttons('rot')}`
    for (const b of root.querySelectorAll('.map-grid button')) b.textContent = MAPS[b.dataset.act.split(':')[1]].name   // (names as plain text)
  }
  buildMapButtons()
  for (const el of root.querySelectorAll('.dummy-select')) {
    el.innerHTML = `<p class="label">Practice Dummies</p>
      <div class="stepper"><button data-act="dummies-down">−</button><span data-text="dummy-count"></span><button data-act="dummies-up">+</button></div>`
  }
  root.querySelector('.dup-builtin').innerHTML = BUILTIN_MAP_IDS.map(id => `<button data-act="dup:${id}">${MAPS[id].name}</button>`).join('')
  const mapCodeInput = root.querySelector('[data-input=map-code]'), exportInput = root.querySelector('[data-input=export-code]')
  const codeInput = root.querySelector('[data-input=join-code]')
  const SOLID_SCREENS = ['main', 'join', 'maps', 'import', 'export']   // out of the game: no arena behind the card
  codeInput.addEventListener('keydown', e => { if (e.key === 'Enter') onAction('connect') })
  return {
    get open() { return root.classList.contains('open') },
    get screen() { return screen },
    // title: in place of the screen's own data-title
    show(name, title) {
      screen = name
      root.classList.add('open')
      root.classList.toggle('solid', SOLID_SCREENS.includes(name))
      root.dataset.screen = name
      for (const el of root.querySelectorAll('.screen')) {
        el.classList.toggle('active', el.dataset.screen === name)
        if (el.dataset.screen === name) this.setText('menu-title', title || el.dataset.title)
      }
      if (name === 'join') setTimeout(() => codeInput.focus(), 0)
      if (name === 'import') { mapCodeInput.value = ''; setTimeout(() => mapCodeInput.focus(), 0) }
    },
    hide() { root.classList.remove('open') },
    setText(key, text) { for (const el of root.querySelectorAll(`[data-text=${key}]`)) el.textContent = text },
    // show/hide elements marked data-show="key"
    setShown(key, shown) { for (const el of root.querySelectorAll(`[data-show=${key}]`)) el.classList.toggle('hidden', !shown) },
    get joinCode() { return codeInput.value.trim().toUpperCase() },
    get mapCode() { return mapCodeInput.value },
    showExportCode(code) { exportInput.value = code; setTimeout(() => exportInput.select(), 0) },
    // the My maps list (names are shown as plain text: they can come from anywhere)
    showMyMaps(defs, confirmDelete) {
      const list = root.querySelector('.my-maps')
      list.replaceChildren()
      for (const d of defs) {
        const row = document.createElement('div')
        row.className = 'my-map'
        const name = document.createElement('div')
        name.className = 'my-map-name'
        name.textContent = d.name + ' '
        const playable = MAPS[d.id] && MAPS[d.id].playable !== false
        if (!playable) name.insertAdjacentHTML('beforeend', '<span class="warn">(needs fixing before it can be played)</span>')
        const buttons = document.createElement('div')
        buttons.className = 'my-map-buttons'
        buttons.innerHTML = `<button data-act="map-play:${d.id}"${playable ? '' : ' disabled'}>Play</button><button data-act="map-edit:${d.id}">Edit</button>` +
          `<button data-act="map-copy:${d.id}">Copy</button><button data-act="map-code:${d.id}">Code</button>` +
          `<button class="danger" data-act="map-delete:${d.id}">${confirmDelete === d.id ? 'Sure?' : 'Delete'}</button>`
        row.append(name, buttons)
        list.appendChild(row)
      }
      if (!defs.length) list.innerHTML = '<p class="label note">No maps yet. Make one!</p>'
    },
    showSettings(settings) {
      for (const mode of MATCH_MODES) {
        for (const b of root.querySelectorAll(`[data-act=mode-${mode}]`)) b.classList.toggle('on', settings.mode === mode)
      }
      for (const el of root.querySelectorAll('.match-settings .stepper')) el.classList.toggle('hidden', settings.mode === 'endless')
      for (const b of root.querySelectorAll('[data-act=order-toggle]')) {
        b.classList.toggle('on', settings.shuffle)
        b.textContent = settings.shuffle ? 'On' : 'Off'
      }
      this.setText('match-num', settings.mode === 'rounds' ? `${settings.rounds} rounds` : `${settings.wins} wins`)
    },
    rebuildMaps: buildMapButtons,
    showMap(id) {
      for (const b of root.querySelectorAll('[data-act^="map:"]')) b.classList.toggle('on', b.dataset.act === 'map:' + id)
    },
    showRotation(maps) {
      for (const b of root.querySelectorAll('[data-act^="rot:"]')) b.classList.toggle('on', !!maps[b.dataset.act.slice(4)])
    },
    showSpawnSettings(settings) {
      for (const row of root.querySelectorAll('.pk-row')) {
        const st = settings[row.dataset.type]
        row.classList.toggle('off', !st.on)
        const toggle = row.querySelector('.pk-on')
        toggle.classList.toggle('on', st.on)
        toggle.textContent = st.on ? 'On' : 'Off'
        for (const b of row.querySelectorAll('.seg button')) b.classList.toggle('on', b.dataset.act.endsWith(':' + st.rate))
      }
    },
  }
}

// =====================================================================
// MAP EDITOR (browser only)
// Edits one custom map (the MAP DATA format) right on the canvas. The map is drawn by the
// normal renderer (no players, nothing moving), and the editor draws its markers, handles
// and the piece being placed on top.
// =====================================================================
const EDITOR_MAP_ID = '__editor'   // (ids starting with __ stay out of the menus and rotation)
const EDITOR_TOOLS = [
  { id: 'select', label: 'Select', key: '1', hint: 'Click a piece to select it. Drag it to move it, drag the white handles to resize. Delete removes it, Ctrl+D copies it, arrow keys nudge it.' },
  { id: 'platform', label: 'Platform', key: '2', hint: 'Drag to draw a platform (or click for a small one).' },
  { id: 'wall', label: 'Wall', key: '3', hint: 'Drag to draw a wall or a ceiling. Walls are solid like platforms, but have no grass and don\'t count as floors.' },
  ...PLAYER_COLOR_NAMES.map((color, i) => ({
    id: 'spawn' + i, label: `Spawn ${i + 1}`, key: '4', spawn: i,
    hint: `Click to move ${color}'s spawn (player ${i + 1}). It lands on the platform under the cursor. Press 4 again for the next spawn.`,
  })),
  { id: 'patch', label: 'Patch', key: '5', hint: 'Click to plant a pumpkin patch on a platform. Select it to make it grow just one kind of pumpkin.' },
  { id: 'bale', label: 'Hay Bale', key: '6', hint: 'Click to place a hay bale. Bales stack on top of each other.' },
  { id: 'spikes', label: 'Pitchforks', key: '7', hint: 'Drag along a platform to lay a row of pitchforks (instant knockout).' },
  { id: 'fire', label: 'Bonfire', key: '8', hint: 'Click to place a bonfire on a platform (burns, and hops you out).' },
  { id: 'scythe', label: 'Scarecrow', key: '9', hint: 'Click to place a scarecrow\'s pivot; its pole reaches down to the platform below. The dashed circle is the scythe\'s reach.' },
  { id: 'mover', label: 'Moving Platform', key: 'M', code: 'KeyM', hint: 'Drag to draw a moving platform where it starts. Then drag its see-through copy to where it goes: it slides back and forth between the two.' },
]
const PIECE_NAMES = { movers: 'Moving platform', platforms: 'Platform', spawns: 'Spawn', patches: 'Patch', bales: 'Hay bale', spikes: 'Pitchforks', fires: 'Bonfire', scythes: 'Scarecrow' }
const PIECE_KINDS = ['spawns', 'scythes', 'patches', 'bales', 'fires', 'spikes', 'movers', 'platforms']   // click order: top first
const TOOL_KINDS = { patch: 'patches', bale: 'bales', fire: 'fires', scythe: 'scythes' }
// number fields for the selected piece: [prop, label, min, max]
const PIECE_FIELDS = {
  platforms: [['x', 'X'], ['y', 'Y'], ['w', 'Width', 0.25, 32], ['h', 'Height', 0.25, 18]],
  spawns: [['x', 'X'], ['y', 'Y']],
  patches: [['x', 'X'], ['y', 'Y']],
  bales: [['x', 'X'], ['y', 'Y']],
  spikes: [['x', 'X'], ['y', 'Y'], ['w', 'Width', 0.3, 32]],
  fires: [['x', 'X'], ['y', 'Y'], ['w', 'Width', 0.4, 6]],
  scythes: [['x', 'X'], ['y', 'Y'], ['length', 'Arm length', 1.4, 6], ['pole', 'Pole', 0, 18], ['turnTime', 'Seconds per turn', 0.5, 10]],
  movers: [['x', 'Start X'], ['y', 'Start Y'], ['x2', 'End X', 0, 32], ['y2', 'End Y', 0, 18], ['w', 'Width', 0.5, 32], ['h', 'Height', 0.25, 4],
    ['speed', 'Speed (m/s)', 0.5, 12], ['pause', 'Wait at ends (s)', 0, 5]],
}
const moverEnd = m => ({ ...m, x: m.x2, y: m.y2 })   // the platform at the far end of its trip

// Outline of a piece (for clicking it and drawing its selection box).
function pieceBox(kind, o) {
  switch (kind) {
    case 'platforms': case 'movers': return { x0: o.x - o.w / 2, x1: o.x + o.w / 2, y0: o.y - o.h / 2, y1: o.y + o.h / 2 }
    case 'spawns': return { x0: o.x - 0.4, x1: o.x + 0.4, y0: o.y, y1: o.y + 1.95 }
    case 'patches': return { x0: o.x - 0.5, x1: o.x + 0.5, y0: o.y, y1: o.y + 0.75 }
    case 'bales': return { x0: o.x - BALE.w / 2, x1: o.x + BALE.w / 2, y0: o.y, y1: o.y + BALE.h }
    case 'spikes': return { x0: o.x - o.w / 2, x1: o.x + o.w / 2, y0: o.y, y1: o.y + TINE.tip }
    case 'fires': return { x0: o.x - o.w / 2, x1: o.x + o.w / 2, y0: o.y, y1: o.y + 0.9 }
    case 'scythes': return { x0: o.x - 0.45, x1: o.x + 0.45, y0: o.y - o.pole, y1: o.y + 1.75 }
  }
}

// Resize handles of a piece: [id, x, y, cursor]
function pieceHandles(kind, o) {
  if (kind === 'movers') return [...pieceHandles('platforms', o), ['end', o.x2, o.y2, 'move']]
  if (kind === 'platforms') {
    const b = pieceBox(kind, o), mx = o.x, my = o.y
    return [['tl', b.x0, b.y1, 'nwse-resize'], ['t', mx, b.y1, 'ns-resize'], ['tr', b.x1, b.y1, 'nesw-resize'], ['r', b.x1, my, 'ew-resize'],
      ['br', b.x1, b.y0, 'nwse-resize'], ['b', mx, b.y0, 'ns-resize'], ['bl', b.x0, b.y0, 'nesw-resize'], ['l', b.x0, my, 'ew-resize']]
  }
  if (kind === 'spikes' || kind === 'fires') return [['l', o.x - o.w / 2, o.y + 0.3, 'ew-resize'], ['r', o.x + o.w / 2, o.y + 0.3, 'ew-resize']]
  if (kind === 'scythes') return [['len', o.x + o.length, o.y, 'ew-resize'], ['pole', o.x, o.y - o.pole, 'ns-resize']]
  return []
}

// A stand-in stick figure where a player starts.
function drawSpawnMarker(ctx, sp, i, X, Y, s) {
  const color = PLAYER_COLORS[i]
  ctx.strokeStyle = color
  ctx.lineWidth = 0.1 * s
  ctx.lineCap = 'round'
  ctx.beginPath()
  ctx.moveTo(X(sp.x - 0.25), Y(sp.y)); ctx.lineTo(X(sp.x), Y(sp.y + 0.75)); ctx.lineTo(X(sp.x + 0.25), Y(sp.y))   // legs
  ctx.moveTo(X(sp.x), Y(sp.y + 0.75)); ctx.lineTo(X(sp.x), Y(sp.y + 1.4))                                      // body
  ctx.moveTo(X(sp.x - 0.3), Y(sp.y + 0.8)); ctx.lineTo(X(sp.x), Y(sp.y + 1.3)); ctx.lineTo(X(sp.x + 0.3), Y(sp.y + 0.8))   // arms
  ctx.stroke()
  ctx.beginPath()
  ctx.arc(X(sp.x), Y(sp.y + 1.62), 0.22 * s, 0, Math.PI * 2)
  ctx.stroke()
  ctx.fillStyle = color
  ctx.font = `bold ${Math.round(0.36 * s)}px system-ui, sans-serif`
  ctx.textAlign = 'center'
  ctx.fillText(String(i + 1), X(sp.x), Y(sp.y + 2.05))
  ctx.lineCap = 'butt'
}

// hooks: onSave(def), onPlaytest(id), onExit()
function createEditor(canvas, view, hooks) {
  const root = document.getElementById('editor')
  const W = CONFIG.view.w, H = CONFIG.view.h
  let def = null            // the map being edited
  let savedJson = ''        // what was last saved (to warn about unsaved changes)
  let tool = 'select'
  let sel = null            // selected piece { kind, index }
  let hover = null          // piece or handle under the cursor (select tool)
  let drag = null           // what the mouse is doing while held down
  let cursor = null         // { x, y, free } in meters
  let undo = [], redo = []  // map data as JSON
  let exitArmed = false     // Exit clicked once with unsaved changes
  let problems = { errors: [], warnings: [] }
  let selKey = ''           // which piece the property panel was built for

  root.innerHTML = `
    <div class="bar">
      ${EDITOR_TOOLS.map(t => t.spawn === undefined ? `<button data-tool="${t.id}" title="${t.label} (${t.key})">${t.label}</button>`
        : `${t.spawn ? '' : '<span class="label">Spawns</span>'}<button class="spawn" data-tool="${t.id}" title="${t.label}: ${PLAYER_COLOR_NAMES[t.spawn]} (4)"><span class="dot" style="background:${PLAYER_COLORS[t.spawn]}"></span>${t.spawn + 1}</button>`).join('')}
      <span class="gap"></span>
      <button data-ed="undo" title="Undo (Ctrl+Z)">Undo</button>
      <button data-ed="redo" title="Redo (Ctrl+Shift+Z)">Redo</button>
      <button data-ed="save" title="Save (Ctrl+S)">Save</button>
      <button data-ed="playtest" class="primary">Play Test</button>
      <button data-ed="exit">Exit</button>
    </div>
    <div class="panel">
      <h3>Map</h3>
      <label class="field">Name <input data-map="name" type="text" maxlength="32" spellcheck="false"></label>
      <label class="field">Theme <select data-map="theme">${Object.keys(THEMES).map(k => `<option value="${k}">${THEMES[k].name}</option>`).join('')}</select></label>
      <p class="status" data-ref="status"></p>
      <h3 data-ref="props-title"></h3>
      <div data-ref="props"></div>
      <h3>Checks</h3>
      <div data-ref="problems"></div>
    </div>`
  const bar = root.querySelector('.bar'), panel = root.querySelector('.panel')
  const ref = name => root.querySelector(`[data-ref=${name}]`)
  const nameInput = root.querySelector('[data-map=name]'), themeSelect = root.querySelector('[data-map=theme]')

  // --- editing the map (every change goes through here, for undo) ---
  const json = () => JSON.stringify(def)
  const piece = p => p && def[p.kind] && def[p.kind][p.index]
  function commit(before) {
    if (before !== json()) {
      undo.push(before)
      if (undo.length > 200) undo.shift()
      redo = []
      exitArmed = false
    }
    refresh()
  }
  const change = fn => { const before = json(); fn(); commit(before) }
  // after any change: rebuild the drawn map and the checks
  function refresh() {
    MAPS[EDITOR_MAP_ID] = toRuntimeMap(def)
    problems = checkMap(def)
    if (sel && !piece(sel)) sel = null
    updatePanel()
  }
  function restore(from, to) {
    if (!from.length) return
    to.push(json())
    def = JSON.parse(from.pop())
    exitArmed = false
    refresh()
  }
  let statusTimer = 0
  function setStatus(text, bad) {
    const el = ref('status')
    el.textContent = text
    el.classList.toggle('bad', !!bad)
    clearTimeout(statusTimer)
    if (text) statusTimer = setTimeout(() => { el.textContent = '' }, 5000)
  }

  // --- snapping ---
  const snap = (v, free) => { const g = free ? 0.05 : 0.25; return r3(Math.round(v / g) * g) }
  // the highest surface at x at or just below y (platform tops; other bales too, for stacking bales)
  function groundAt(x, y, kind, skip) {
    let best = null
    const consider = (left, right, top) => { if (x > left && x < right && top <= y + 0.5 && (best === null || top > best)) best = top }
    for (const p of def.platforms) consider(p.x - p.w / 2, p.x + p.w / 2, r3(p.y + p.h / 2))
    if (kind === 'bales') {
      def.bales.forEach((b, i) => { if (i !== skip) consider(b.x - BALE.w / 2, b.x + BALE.w / 2, r3(b.y + BALE.h)) })
      for (const m of def.movers) consider(m.x - m.w / 2, m.x + m.w / 2, r3(m.y + m.h / 2))   // (rides along)
    }
    return best
  }
  // put a piece that stands on the ground at (x, y): on the surface below, or in the air if there's none
  function placeOnGround(kind, o, x, y, free, skip) {
    o.x = clamp(snap(x, free), 0, W)
    const g = groundAt(o.x, y, kind, skip)
    o.y = clamp(g !== null ? g : snap(y, free), 0, H)
  }
  function placePiece(kind, o, x, y, free, index) {
    if (kind === 'platforms' || kind === 'movers') {   // keep the edges on the grid
      o.x = r3(snap(x - o.w / 2, free) + o.w / 2)
      o.y = r3(snap(y - o.h / 2, free) + o.h / 2)
    } else if (kind === 'scythes') {
      o.x = clamp(snap(x, free), 0, W)
      o.y = clamp(snap(y, free), 0, H)
    } else placeOnGround(kind, o, x, y, free, index)
  }

  // --- what's under the cursor ---
  function hitPiece(x, y) {
    for (const kind of PIECE_KINDS) {
      let best = null, bestArea = Infinity
      def[kind].forEach((o, index) => {
        const b = pieceBox(kind, o)
        const area = (b.x1 - b.x0) * (b.y1 - b.y0)
        // (smallest first, so a ledge in front of a big wall is easy to pick)
        if (x >= b.x0 && x <= b.x1 && y >= b.y0 && y <= b.y1 && area <= bestArea) { best = { kind, index }; bestArea = area }
      })
      if (best) return best
    }
    return null
  }
  function hitHandle(x, y) {
    const o = piece(sel)
    if (!o) return null
    const r = 9 / view.s
    const h = pieceHandles(sel.kind, o).find(([, hx, hy]) => Math.abs(x - hx) < r && Math.abs(y - hy) < r)
    if (h) return { id: h[0], cursor: h[3] }
    if (sel.kind === 'movers' && inPieceBox('movers', moverEnd(o), x, y)) return { id: 'end', cursor: 'move' }
    return null
  }
  const inPieceBox = (kind, o, x, y) => { const b = pieceBox(kind, o); return x >= b.x0 && x <= b.x1 && y >= b.y0 && y <= b.y1 }
  function dragHandle(o, orig, id, x, y, free, start) {
    if (id === 'end') {   // a mover's far end (keeping its edges on the grid, like the start)
      o.x2 = clamp(r3(snap(orig.x2 + x - start.x - o.w / 2, free) + o.w / 2), 0, W)
      o.y2 = clamp(r3(snap(orig.y2 + y - start.y - o.h / 2, free) + o.h / 2), 0, H)
    } else if (sel.kind === 'platforms' || sel.kind === 'movers') {
      let x0 = orig.x - orig.w / 2, x1 = orig.x + orig.w / 2, y0 = orig.y - orig.h / 2, y1 = orig.y + orig.h / 2
      const sx = snap(x, free), sy = snap(y, free)
      if (id.includes('l')) x0 = Math.min(sx, x1 - 0.25)
      if (id.includes('r')) x1 = Math.max(sx, x0 + 0.25)
      if (id.includes('b')) y0 = Math.min(sy, y1 - 0.25)
      if (id.includes('t')) y1 = Math.max(sy, y0 + 0.25)
      Object.assign(o, { x: r3((x0 + x1) / 2), y: r3((y0 + y1) / 2), w: r3(x1 - x0), h: r3(y1 - y0) })
    } else if (sel.kind === 'spikes' || sel.kind === 'fires') {
      const [lo, hi] = sel.kind === 'fires' ? [0.4, 6] : [0.3, W]
      let x0 = orig.x - orig.w / 2, x1 = orig.x + orig.w / 2
      if (id === 'l') x0 = clamp(snap(x, free), x1 - hi, x1 - lo)
      else x1 = clamp(snap(x, free), x0 + lo, x0 + hi)
      Object.assign(o, { x: r3((x0 + x1) / 2), w: r3(x1 - x0) })
    } else if (sel.kind === 'scythes') {
      if (id === 'len') o.length = clamp(snap(Math.hypot(x - o.x, y - o.y), free), 1.4, 6)
      else o.pole = clamp(snap(o.y - y, free), 0, H)
    }
  }

  // --- mouse ---
  const worldAt = e => ({ x: (e.clientX - view.ox) / view.s, y: H - (e.clientY - view.oy) / view.s, free: e.shiftKey })
  function onDown(e) {
    if (!api.active || e.button !== 0) return
    const m = worldAt(e)
    const before = json()
    if (tool === 'select') {
      const h = hitHandle(m.x, m.y)
      if (h) { drag = { type: 'handle', id: h.id, before, orig: { ...piece(sel) }, start: m }; return }
      sel = hitPiece(m.x, m.y)
      if (!sel) {   // grabbing a mover's see-through end copy moves its end
        const i = def.movers.findIndex(o => inPieceBox('movers', moverEnd(o), m.x, m.y))
        if (i >= 0) {
          sel = { kind: 'movers', index: i }
          drag = { type: 'handle', id: 'end', before, orig: { ...def.movers[i] }, start: m }
          updatePanel()
          return
        }
      }
      updatePanel()
      if (sel) drag = { type: 'move', before, start: m, orig: { ...piece(sel) } }
      return
    }
    if (tool === 'platform' || tool === 'wall' || tool === 'mover') { drag = { type: 'rect', before, x0: snap(m.x, m.free), y0: snap(m.y, m.free), x1: snap(m.x, m.free), y1: snap(m.y, m.free) }; return }
    if (tool === 'spikes') {
      if (def.spikes.length >= MAP_LIMITS.spikes) { setStatus('That\'s as many pitchfork rows as a map can have.', true); return }
      const g = groundAt(snap(m.x, m.free), m.y)
      drag = { type: 'spikes', before, x0: snap(m.x, m.free), x1: snap(m.x, m.free), y: g !== null ? g : snap(m.y, m.free) }
      return
    }
    // click-to-place pieces: place it, then keep dragging it around until the mouse comes up
    let kind, index
    if (tool.startsWith('spawn')) { kind = 'spawns'; index = Number(tool.slice(5)) }
    else {
      kind = TOOL_KINDS[tool]
      if (def[kind].length >= MAP_LIMITS[kind]) { setStatus(`That's as many ${PIECE_NAMES[kind].toLowerCase()}s as a map can have.`, true); return }
      const o = kind === 'fires' ? { w: 1.4 } : kind === 'scythes' ? { length: 2.6, turnTime: CONFIG.level.scytheTurnTime } : {}
      index = def[kind].push(o) - 1
    }
    const o = def[kind][index]
    placePiece(kind, o, m.x, m.y, m.free, index)
    if (kind === 'scythes') { const g = groundAt(o.x, o.y - 0.3); o.pole = g !== null ? r3(o.y - g) : 2.6 }
    sel = { kind, index }
    drag = { type: 'move', before, start: m, orig: { ...o } }
    refresh()
  }
  function onMove(e) {
    if (!api.active) return
    const m = cursor = worldAt(e)
    if (drag) {
      if (drag.type === 'move') {
        const o = piece(sel)
        placePiece(sel.kind, o, drag.orig.x + m.x - drag.start.x, drag.orig.y + m.y - drag.start.y, m.free, sel.index)
        if (sel.kind === 'movers') moveEnd(o, drag.orig)
        refresh()
      } else if (drag.type === 'handle') {
        dragHandle(piece(sel), drag.orig, drag.id, m.x, m.y, m.free, drag.start)
        refresh()
      } else if (drag.type === 'rect') { drag.x1 = snap(m.x, m.free); drag.y1 = snap(m.y, m.free) }
      else if (drag.type === 'spikes') drag.x1 = snap(m.x, m.free)
    }
    // cursor shape
    let c = 'crosshair'
    if (tool === 'select') {
      const h = !drag && hitHandle(m.x, m.y)
      hover = drag ? null : h ? null : hitPiece(m.x, m.y)
      c = drag && drag.type === 'move' ? 'grabbing' : h ? h.cursor : hover ? 'grab' : 'default'
    }
    canvas.style.cursor = c
  }
  // moving a mover moves its whole trip
  const moveEnd = (o, orig) => {
    o.x2 = clamp(r3(orig.x2 + o.x - orig.x), 0, W)
    o.y2 = clamp(r3(orig.y2 + o.y - orig.y), 0, H)
  }
  function onUp(e) {
    if (!api.active || !drag || e.button !== 0) return
    const d = drag
    drag = null
    if (d.type === 'rect' && tool === 'mover') {
      if (def.movers.length >= MAP_LIMITS.movers) { setStatus('That\'s as many moving platforms as a map can have.', true); return }
      const x0 = Math.min(d.x0, d.x1), x1 = Math.max(d.x0, d.x1), y0 = Math.min(d.y0, d.y1), y1 = Math.max(d.y0, d.y1)
      const m = x1 - x0 >= 0.5 && y1 - y0 >= 0.25 ? { x: r3((x0 + x1) / 2), y: r3((y0 + y1) / 2), w: r3(x1 - x0), h: r3(Math.min(4, y1 - y0)) }
        : { x: d.x0, y: r3(d.y0 - 0.25), w: 3, h: 0.5 }
      // it starts out going 5 m sideways (toward the middle); drag its end copy to change that
      Object.assign(m, { x2: r3(m.x + (m.x < W / 2 ? 5 : -5)), y2: m.y, speed: 3, pause: 1 })
      def.movers.push(m)
      setTool('select')   // (so its end copy can be dragged right away)
      sel = { kind: 'movers', index: def.movers.length - 1 }
      setStatus('Now drag the see-through copy to where it should go.')
    } else if (d.type === 'rect') {
      const x0 = Math.min(d.x0, d.x1), x1 = Math.max(d.x0, d.x1), y0 = Math.min(d.y0, d.y1), y1 = Math.max(d.y0, d.y1)
      const wall = tool === 'wall'
      if (def.platforms.length >= MAP_LIMITS.platforms) { setStatus('That\'s as many platforms as a map can have.', true); return }
      let p
      if (x1 - x0 >= 0.25 && y1 - y0 >= 0.25) p = { x: r3((x0 + x1) / 2), y: r3((y0 + y1) / 2), w: r3(x1 - x0), h: r3(y1 - y0) }
      else if (wall) p = { x: d.x0, y: r3(d.y0 - 2), w: 0.8, h: 4 }                  // just a click: a standard wall
      else p = { x: d.x0, y: r3(d.y0 - 0.25), w: 4, h: 0.5 }                         // or a ledge with its top at the click
      if (wall) p.wall = true
      sel = { kind: 'platforms', index: def.platforms.push(p) - 1 }
    } else if (d.type === 'spikes') {
      const x0 = Math.min(d.x0, d.x1), x1 = Math.max(d.x0, d.x1)
      const sp = x1 - x0 >= 0.3 ? { x: r3((x0 + x1) / 2), y: d.y, w: r3(x1 - x0) } : { x: d.x0, y: d.y, w: 2 }
      sel = { kind: 'spikes', index: def.spikes.push(sp) - 1 }
    }
    commit(d.before)
  }
  canvas.addEventListener('mousedown', onDown)
  window.addEventListener('mousemove', onMove)
  window.addEventListener('mouseup', onUp)
  canvas.addEventListener('mouseleave', () => { cursor = null; hover = null })

  // --- keys (all keys go here while editing) ---
  function onKey(e) {
    const mod = e.ctrlKey || e.metaKey
    if (mod && e.code === 'KeyZ') { e.preventDefault(); if (e.shiftKey) restore(redo, undo); else restore(undo, redo); return }
    if (mod && e.code === 'KeyY') { e.preventDefault(); restore(redo, undo); return }
    if (mod && e.code === 'KeyS') { e.preventDefault(); save(); return }
    if (mod && e.code === 'KeyD') { e.preventDefault(); duplicateSelected(); return }
    if (mod) return
    if (e.code === 'Delete' || e.code === 'Backspace') { e.preventDefault(); deleteSelected(); return }
    if (e.code === 'Escape') {
      if (drag) { def = JSON.parse(drag.before); drag = null; refresh() }
      else if (sel) { sel = null; updatePanel() }
      else setTool('select')
      return
    }
    const group = EDITOR_TOOLS.filter(t => (t.code || 'Digit' + t.key) === e.code)   // (4 = the spawns, again for the next one)
    if (group.length) { const i = group.findIndex(t => t.id === tool); setTool(group[(i + 1) % group.length].id); return }
    const nudge = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] }[e.code]
    if (nudge && piece(sel)) {
      e.preventDefault()
      const step = e.shiftKey ? 0.05 : 0.25
      change(() => {
        const o = piece(sel), orig = { ...o }
        o.x = r3(clamp(o.x + nudge[0] * step, 0, W))
        o.y = r3(clamp(o.y + nudge[1] * step, 0, H))
        if (sel.kind === 'movers') moveEnd(o, orig)
      })
    }
  }
  function deleteSelected() {
    if (!piece(sel)) return
    if (sel.kind === 'spawns') { setStatus('Spawns can\'t be deleted, just moved.', true); return }
    change(() => { def[sel.kind].splice(sel.index, 1); sel = null })
  }
  function duplicateSelected() {
    const o = piece(sel)
    if (!o || sel.kind === 'spawns') return
    if (def[sel.kind].length >= MAP_LIMITS[sel.kind]) { setStatus('That map has as many of those as it can.', true); return }
    const copy = { ...o, x: r3(Math.min(W, o.x + 1)) }
    if (sel.kind === 'movers') moveEnd(copy, o)
    change(() => { sel = { kind: sel.kind, index: def[sel.kind].push(copy) - 1 } })
  }
  function setTool(id) {
    tool = id
    hover = null
    if (id !== 'select') sel = null
    updatePanel()
  }

  // --- toolbar + panel ---
  root.addEventListener('click', e => {
    const b = e.target.closest('button')
    if (!b) return
    b.blur()
    if (b.dataset.tool) setTool(b.dataset.tool)
    const act = b.dataset.ed
    if (act === 'undo') restore(undo, redo)
    else if (act === 'redo') restore(redo, undo)
    else if (act === 'save') save()
    else if (act === 'playtest') {
      if (problems.errors.length) { setStatus('Fix the problems marked in red first.', true); return }
      save()
      hooks.onPlaytest(def.id)
    } else if (act === 'exit') {
      if (json() !== savedJson && !exitArmed) { exitArmed = true; updatePanel(); setStatus('You have unsaved changes. Click "Discard changes" to leave without saving.', true); return }
      hooks.onExit()
    } else if (act === 'delete-piece') deleteSelected()
    else if (b.dataset.problem) {
      const [kind, index] = b.dataset.problem.split(':')
      setTool('select')
      sel = { kind, index: Number(index) }
      updatePanel()
    }
  })
  nameInput.addEventListener('change', () => change(() => { def.name = nameInput.value.replace(/[\u0000-\u001f]/g, '').slice(0, 32).trim() || 'Custom map' }))
  themeSelect.addEventListener('change', () => change(() => { def.theme = themeSelect.value }))
  panel.addEventListener('change', e => {
    const el = e.target, o = piece(sel)
    if (!o || !el.dataset.prop) return
    const prop = el.dataset.prop
    change(() => {
      if (prop === 'only') { if (el.value) o.only = el.value; else delete o.only; return }
      if (prop === 'wall') { if (el.checked) o.wall = true; else delete o.wall; return }
      const f = PIECE_FIELDS[sel.kind].find(f => f[0] === prop)
      const v = Number(el.value)
      if (Number.isFinite(v)) o[prop] = r3(clamp(v, f[2] ?? 0, f[3] ?? (prop === 'x' ? W : H)))
    })
  })

  function save() {
    def.name = def.name || 'Custom map'
    hooks.onSave(JSON.parse(json()))
    savedJson = json()
    exitArmed = false
    updatePanel()
    setStatus(problems.errors.length ? 'Saved. It can\'t be played until the red problems are fixed.' : 'Saved!')
  }

  function updatePanel() {
    for (const b of bar.querySelectorAll('[data-tool]')) b.classList.toggle('on', b.dataset.tool === tool)
    bar.querySelector('[data-ed=undo]').disabled = !undo.length
    bar.querySelector('[data-ed=redo]').disabled = !redo.length
    bar.querySelector('[data-ed=save]').textContent = json() === savedJson ? 'Saved' : 'Save'
    const exit = bar.querySelector('[data-ed=exit]')
    exit.textContent = exitArmed ? 'Discard changes' : 'Exit'
    exit.classList.toggle('danger', exitArmed)
    if (document.activeElement !== nameInput) nameInput.value = def.name
    themeSelect.value = def.theme

    // the selected piece's properties (rebuilt only when the selection changes, so typing isn't interrupted)
    const o = piece(sel)
    const key = o ? `${sel.kind}:${sel.index}` : 'tool:' + tool
    if (key !== selKey) {
      selKey = key
      const props = ref('props')
      if (!o) {
        const t = EDITOR_TOOLS.find(t => t.id === tool)
        ref('props-title').textContent = t.label + ' tool'
        props.innerHTML = '<p class="hint"></p>'
        props.firstChild.textContent = t.hint
      } else {
        ref('props-title').textContent = sel.kind === 'spawns' ? `Spawn ${sel.index + 1} (${PLAYER_COLOR_NAMES[sel.index]})` : PIECE_NAMES[sel.kind]
        let html = `<div class="nums">${PIECE_FIELDS[sel.kind].map(([prop, label]) =>
          `<label>${label}<input type="number" step="0.25" data-prop="${prop}"></label>`).join('')}</div>`
        if (sel.kind === 'platforms') html += '<label class="check"><input type="checkbox" data-prop="wall"> Wall / ceiling</label>'
        if (sel.kind === 'patches') {
          html += `<label class="field">Grows <select data-prop="only"><option value="">Any (see Pumpkins)</option>${
            SPAWNABLE_TYPES.map(k => `<option value="${k}">Only ${PUMPKIN_TYPES[k].name}</option>`).join('')}</select></label>`
        }
        if (sel.kind !== 'spawns') html += '<button data-ed="delete-piece" class="danger">Delete</button>'
        props.innerHTML = html
      }
    }
    if (o) {
      for (const el of ref('props').querySelectorAll('[data-prop]')) {
        if (el === document.activeElement) continue
        if (el.type === 'checkbox') el.checked = !!o[el.dataset.prop]
        else if (el.tagName === 'SELECT') el.value = o.only || ''
        else el.value = o[el.dataset.prop]
      }
    }

    // checks
    const list = ref('problems')
    list.replaceChildren()
    const add = (p, cls) => {
      const b = document.createElement(p.kind && p.index >= 0 && def[p.kind][p.index] ? 'button' : 'p')
      b.className = 'problem ' + cls
      b.textContent = p.msg
      if (b.tagName === 'BUTTON') b.dataset.problem = `${p.kind}:${p.index}`
      list.appendChild(b)
    }
    problems.errors.forEach(p => add(p, 'err'))
    problems.warnings.forEach(p => add(p, 'warn'))
    if (!list.childElementCount) {
      const p = document.createElement('p')
      p.className = 'problem ok'
      p.textContent = 'All good: ready to play!'
      list.appendChild(p)
    }
  }

  // --- drawing on top of the map ---
  function drawOverlay(ctx, X, Y, s) {
    const theme = THEMES[def.theme]
    // grid: a line every meter, stronger every 4
    ctx.lineWidth = 1
    for (let i = 0; i <= W; i++) {
      ctx.strokeStyle = hexA(theme.ink, i % 4 ? 0.06 : 0.14)
      ctx.beginPath(); ctx.moveTo(X(i), Y(0)); ctx.lineTo(X(i), Y(H)); ctx.stroke()
    }
    for (let j = 0; j <= H; j++) {
      ctx.strokeStyle = hexA(theme.ink, j % 4 ? 0.06 : 0.14)
      ctx.beginPath(); ctx.moveTo(X(0), Y(j)); ctx.lineTo(X(W), Y(j)); ctx.stroke()
    }
    // markers: spawns, scythe reach, what a patch grows
    def.spawns.forEach((sp, i) => drawSpawnMarker(ctx, sp, i, X, Y, s))
    ctx.setLineDash([6, 5])
    ctx.strokeStyle = 'rgba(200, 40, 40, 0.55)'
    ctx.lineWidth = 1.5
    for (const sc of def.scythes) { ctx.beginPath(); ctx.arc(X(sc.x), Y(sc.y), sc.length * s, 0, Math.PI * 2); ctx.stroke() }
    ctx.setLineDash([])
    for (const m of def.movers) {   // where each moving platform goes: a see-through copy + an arrow
      const e = moverEnd(m)
      ctx.fillStyle = hexA(theme.platform, 0.3)
      ctx.fillRect(X(e.x - e.w / 2), Y(e.y + e.h / 2), e.w * s, e.h * s)
      ctx.setLineDash([5, 4])
      ctx.strokeStyle = hexA(theme.ink, 0.6)
      ctx.lineWidth = 1.5
      ctx.strokeRect(X(e.x - e.w / 2), Y(e.y + e.h / 2), e.w * s, e.h * s)
      ctx.setLineDash([])
      const len = Math.hypot(m.x2 - m.x, m.y2 - m.y)
      if (len > 0.6) {
        const ux = (m.x2 - m.x) / len, uy = (m.y2 - m.y) / len, hx = m.x2 - ux * 0.15, hy = m.y2 - uy * 0.15
        ctx.strokeStyle = ctx.fillStyle = hexA(theme.ink, 0.7)
        ctx.beginPath(); ctx.moveTo(X(m.x), Y(m.y)); ctx.lineTo(X(hx), Y(hy)); ctx.stroke()
        ctx.beginPath()
        ctx.moveTo(X(hx), Y(hy))
        ctx.lineTo(X(hx - ux * 0.45 - uy * 0.25), Y(hy - uy * 0.45 + ux * 0.25))
        ctx.lineTo(X(hx - ux * 0.45 + uy * 0.25), Y(hy - uy * 0.45 - ux * 0.25))
        ctx.fill()
      }
    }
    ctx.font = `bold ${Math.round(0.28 * s)}px system-ui, sans-serif`
    ctx.textAlign = 'center'
    for (const pt of def.patches) {
      if (!pt.only) continue
      ctx.fillStyle = theme.ink
      ctx.fillText(PUMPKIN_TYPES[pt.only].name, X(pt.x), Y(pt.y + 1.05))
    }
    // problems: red/amber outlines on the pieces they're about
    const outline = (kind, index, color, dash, pad = 0.08) => {
      const o = def[kind] && def[kind][index]
      if (!o) return
      const b = pieceBox(kind, o)
      ctx.setLineDash(dash)
      ctx.strokeStyle = color
      ctx.strokeRect(X(b.x0 - pad), Y(b.y1 + pad), (b.x1 - b.x0 + 2 * pad) * s, (b.y1 - b.y0 + 2 * pad) * s)
      ctx.setLineDash([])
    }
    ctx.lineWidth = 2
    for (const p of problems.warnings) outline(p.kind, p.index, '#e89a1c', [5, 4])
    for (const p of problems.errors) outline(p.kind, p.index, '#e0302a', [5, 4])
    if (hover && !(sel && hover.kind === sel.kind && hover.index === sel.index)) { ctx.lineWidth = 1.5; outline(hover.kind, hover.index, 'rgba(43, 155, 255, 0.6)', []) }
    // selection + handles
    const o = piece(sel)
    if (o) {
      ctx.lineWidth = 2
      outline(sel.kind, sel.index, '#2b9bff', [], 0.1)
      if (sel.kind === 'scythes') {   // the arm the length handle sits on
        ctx.strokeStyle = '#2b9bff'
        ctx.beginPath(); ctx.moveTo(X(o.x), Y(o.y)); ctx.lineTo(X(o.x + o.length), Y(o.y)); ctx.stroke()
      }
      for (const [, hx, hy] of pieceHandles(sel.kind, o)) {
        ctx.fillStyle = '#fff'
        ctx.strokeStyle = '#1d6fb8'
        ctx.lineWidth = 1.5
        ctx.fillRect(X(hx) - 5, Y(hy) - 5, 10, 10)
        ctx.strokeRect(X(hx) - 5, Y(hy) - 5, 10, 10)
      }
    }
    // the piece being drawn
    if (drag && drag.type === 'rect') {
      const x0 = Math.min(drag.x0, drag.x1), x1 = Math.max(drag.x0, drag.x1), y0 = Math.min(drag.y0, drag.y1), y1 = Math.max(drag.y0, drag.y1)
      ctx.fillStyle = hexA(tool === 'wall' ? theme.wall : theme.platform, 0.55)
      ctx.fillRect(X(x0), Y(y1), (x1 - x0) * s, (y1 - y0) * s)
      ctx.strokeStyle = '#2b9bff'
      ctx.lineWidth = 2
      ctx.strokeRect(X(x0), Y(y1), (x1 - x0) * s, (y1 - y0) * s)
    } else if (drag && drag.type === 'spikes') {
      const x0 = Math.min(drag.x0, drag.x1), x1 = Math.max(drag.x0, drag.x1)
      ctx.globalAlpha = 0.6
      drawPitchforks(ctx, { x: (x0 + x1) / 2, y: drag.y, w: Math.max(0.3, x1 - x0) }, X, Y, s)
      ctx.globalAlpha = 1
    } else if (!drag && cursor && tool !== 'select') {
      // where a click would put it
      const ghost = { w: 1.4, length: 2.6 }
      const kind = tool.startsWith('spawn') ? 'spawns' : TOOL_KINDS[tool]
      if (kind) {
        placePiece(kind, ghost, cursor.x, cursor.y, cursor.free, -1)
        ctx.globalAlpha = 0.5
        if (kind === 'spawns') drawSpawnMarker(ctx, ghost, Number(tool.slice(5)), X, Y, s)
        else if (kind === 'patches') drawPumpkin(ctx, X(ghost.x), Y(ghost.y + 0.32), 0.3 * s, 0, PUMPKIN_TYPES.classic)
        else if (kind === 'bales') drawBale(ctx, ghost.x, ghost.y + BALE.h / 2, 0, 1, 0, X, Y, s)
        else if (kind === 'fires') { drawBonfire(ctx, ghost, X, Y, s, false); drawBonfire(ctx, ghost, X, Y, s, true) }
        else if (kind === 'scythes') { const g = groundAt(ghost.x, ghost.y - 0.3); ghost.pole = g !== null ? ghost.y - g : 2.6; drawScarecrow(ctx, ghost, SCYTHE_START, X, Y, s) }
        ctx.globalAlpha = 1
      } else {
        ctx.fillStyle = '#2b9bff'
        ctx.beginPath(); ctx.arc(X(snap(cursor.x, cursor.free)), Y(snap(cursor.y, cursor.free)), 4, 0, Math.PI * 2); ctx.fill()
      }
    }
    // help + where the cursor is, along the bottom
    ctx.font = `${Math.round(0.32 * s)}px system-ui, sans-serif`
    ctx.fillStyle = theme.muted
    ctx.strokeStyle = theme.sky[1]
    ctx.lineWidth = 3
    ctx.lineJoin = 'round'
    const outlined = (text, x, align) => { ctx.textAlign = align; ctx.strokeText(text, X(x), Y(0.35)); ctx.fillText(text, X(x), Y(0.35)) }
    outlined('Snaps to a 0.25 m grid (hold Shift for fine placement) · 1–9, M tools · Ctrl+Z undo · Del delete · Esc deselect', 0.4, 'left')
    if (cursor && cursor.x >= 0 && cursor.x <= W && cursor.y >= 0 && cursor.y <= H) outlined(`x ${cursor.x.toFixed(2)}  y ${cursor.y.toFixed(2)}`, W - 0.4, 'right')
  }

  const api = {
    active: false,
    get dirty() { return json() !== savedJson },
    open(d) {
      def = JSON.parse(JSON.stringify(d))
      fillSpawns(def)   // (always all four, so they can't go missing)
      while (def.spawns.length < MAX_PLAYERS) def.spawns.push({ x: 5 + 7 * def.spawns.length, y: 4 })
      savedJson = json()
      tool = 'select'; sel = null; hover = null; drag = null; undo = []; redo = []; exitArmed = false; selKey = ''
      api.active = true
      root.classList.add('open')
      setStatus('')
      refresh()
    },
    close() {
      api.active = false
      root.classList.remove('open')
      canvas.style.cursor = ''
      delete MAPS[EDITOR_MAP_ID]
    },
    // room the toolbar and panel take up (the map is fit into the rest)
    insets() {
      if (!api.active) return { top: 0, right: 0 }
      panel.style.top = bar.offsetHeight + 'px'
      return { top: bar.offsetHeight, right: panel.offsetWidth }
    },
    // what render() draws: the map with its bales and ripe patches, no players
    snapshot() {
      return {
        time: 0, map: EDITOR_MAP_ID, players: [], pumpkins: [], scythes: [], movers: def.movers.map(m => [m.x, m.y]),
        bales: def.bales.map((b, i) => [i, b.x, b.y + BALE.h / 2, 0, 1, 0]),
        patches: def.patches.map(p => [PATCH_STATES.indexOf('ripe'), 1, 0, PUMPKIN_TYPE_NAMES.indexOf(p.only || 'classic')]),
        timeScale: 1, transition: null, match: null,
      }
    },
    drawOverlay,
    onKey,
  }
  return api
}

// =====================================================================
// GAME LOOP (browser only)
// =====================================================================
function boot() {
  const canvas = document.getElementById('game')
  const ctx = canvas.getContext('2d')
  const game = createGame()
  window.game = game   // handy for poking at from the browser dev console
  const effects = createEffects()
  const tuning = createTuningPanel(game)
  const keys = new Set()
  const tapped = new Set()   // pressed since the last physics step (so quick taps aren't missed)
  const mouse = { x: 0, y: 0, down: false }
  const ui = { debug: false, fps: 60, localIndex: 0, hud: '', debugLines: [], game: null, message: '' }
  const view = { s: 1, ox: 0, oy: 0, w: 0, h: 0 }
  const now = () => performance.now() / 1000

  // --- session state ---
  let mode = 'practice'      // 'practice' | 'host' | 'guest'
  let peer = null
  let link = null            // guest: the GuestLink while connected
  const links = new Map()    // host: slot → HostLink, one per friend
  const friendNames = () => [...links.keys()].sort().map(slot => PLAYER_COLOR_NAMES[slot]).join(', ')
  let hostCode = null
  let joinTimer = null
  let flash = { text: '', until: 0 }
  // this browser's custom maps (made in the map editor)
  let customMaps = loadCustomMaps()
  for (const def of customMaps) registerMap(def)

  // which pumpkins grow and how often: the host's choice (also used in practice)
  const SPAWN_STORAGE_KEY = 'pumpkin-fight-spawns'
  const spawnSettings = defaultSpawnSettings()
  try {
    const saved = JSON.parse(localStorage.getItem(SPAWN_STORAGE_KEY)) || {}
    for (const k of SPAWNABLE_TYPES) {
      if (saved[k]) spawnSettings[k] = { on: !!saved[k].on, rate: SPAWN_RATES[saved[k].rate] ? saved[k].rate : spawnSettings[k].rate }
    }
  } catch (e) {}
  game.spawnSettings = spawnSettings
  const changeSpawns = fn => {
    fn(spawnSettings)
    try { localStorage.setItem(SPAWN_STORAGE_KEY, JSON.stringify(spawnSettings)) } catch (e) {}
    menu.showSpawnSettings(spawnSettings)
  }
  let pumpkinsReturnTo = 'main'   // the menu screen "Done" goes back to
  let matchReturnTo = 'host'      // (same for Match Settings)

  // The practice map (practice and waiting for a friend). Matches use the rotation instead.
  const MAP_STORAGE_KEY = 'pumpkin-fight-map'
  let practiceMap = 'patch'
  try { const saved = localStorage.getItem(MAP_STORAGE_KEY); if (MAPS[saved]) practiceMap = saved } catch (e) {}
  game.mapChoice = practiceMap
  const chooseMap = id => {
    practiceMap = id
    try { localStorage.setItem(MAP_STORAGE_KEY, id) } catch (e) {}
    menu.showMap(id)
    if (!game.match && id !== game.map) startTransition(game, id)   // pan over to it right away
  }

  const MATCH_STORAGE_KEY = 'pumpkin-fight-match'
  const matchSettings = defaultMatchSettings()   // the host's choice; game.match.settings points at this
  try { Object.assign(matchSettings, JSON.parse(localStorage.getItem(MATCH_STORAGE_KEY)) || {}) } catch (e) {}
  if (!MATCH_MODES.includes(matchSettings.mode)) matchSettings.mode = 'rounds'
  matchSettings.shuffle = matchSettings.shuffle !== false
  matchSettings.maps = { ...defaultRotation(), ...(matchSettings.maps || {}) }   // (new maps start on)
  const changeSettings = fn => {
    fn(matchSettings)
    matchSettings.rounds = clamp(Math.round(matchSettings.rounds), 1, 99)
    matchSettings.wins = clamp(Math.round(matchSettings.wins), 1, 50)
    try { localStorage.setItem(MATCH_STORAGE_KEY, JSON.stringify(matchSettings)) } catch (e) {}
    menu.showSettings(matchSettings)
    menu.showRotation(matchSettings.maps)
  }
  const showMessage = (text, seconds = 3) => { flash = { text, until: now() + seconds } }

  const menu = createMenu(act => {
    if (act === 'host') startHosting()
    else if (act === 'show-join') { menu.show('join'); menu.setText('join-status', '') }
    else if (act === 'connect') joinGame(menu.joinCode)
    else if (act === 'practice') { leaveSession(); resetRound(game); menu.hide() }
    else if (act === 'resume') menu.hide()
    else if (act === 'leave') { leaveSession(); menu.show('main'); menu.setText('main-status', '') }
    else if (act === 'copy-code' && hostCode) navigator.clipboard.writeText(hostCode).catch(() => {})
    else if (act.startsWith('mode-')) changeSettings(m => { m.mode = act.slice(5) })
    else if (act === 'num-down' || act === 'num-up') {
      const d = act === 'num-up' ? 1 : -1
      changeSettings(m => { if (m.mode === 'rounds') m.rounds += d; else m.wins += d })
    } else if (act === 'restart' && mode === 'host' && links.size) { startMatch(game, matchSettings); menu.hide() }
    else if (act === 'dummies-down' || act === 'dummies-up') changeDummies(dummyCount + (act === 'dummies-up' ? 1 : -1))
    else if (act === 'order-toggle') changeSettings(m => { m.shuffle = !m.shuffle })
    else if (act === 'show-match') { matchReturnTo = menu.screen; openSettings() }
    else if (act === 'match-done') closeMatchSettings()
    else if (act === 'show-pumpkins') { pumpkinsReturnTo = menu.screen; menu.show('pumpkins') }
    else if (act === 'pumpkins-done') closePumpkinSettings()
    else if (act.startsWith('map:')) chooseMap(act.slice(4))
    else if (act.startsWith('rot:')) {
      const id = act.slice(4)
      changeSettings(m => {
        m.maps[id] = !m.maps[id]
        if (!mapIds().some(k => m.maps[k])) m.maps[id] = true   // keep at least one map on
      })
    }
    else if (act === 'show-maps') showMyMaps()
    else if (act === 'maps-back') menu.show('main')
    else if (act === 'map-new') {
      const def = sanitizeMap({
        name: uniqueName('My map'), theme: 'paper',
        platforms: [{ x: 16, y: 3, w: 24, h: 1 }], spawns: [{ x: 9, y: 3.5 }, { x: 23, y: 3.5 }], patches: [{ x: 16, y: 3.5 }],
      })
      storeCustomMap(def)
      openEditor(def.id)
    } else if (act === 'show-import') { menu.show('import'); menu.setText('import-status', '') }
    else if (act === 'map-import') {
      const def = decodeMapCode(menu.mapCode)
      if (!def) { menu.setText('import-status', "That doesn't look like a map code. It should start with " + MAP_CODE_PREFIX); return }
      def.name = uniqueName(def.name)
      storeCustomMap(def)
      showMyMaps(`Imported "${def.name}".`)
    } else if (act === 'export-copy') {
      navigator.clipboard.writeText(exportCode).then(() => menu.setText('export-status', 'Copied!'),
        () => menu.setText('export-status', 'Select the code above and copy it (Ctrl/Cmd+C).'))
    } else if (act === 'exit') {   // (a play test goes back to the editor)
      if (playtestId) { const id = playtestId; leaveSession(); openEditor(id) }
      else { leaveSession(); menu.show('main'); menu.setText('main-status', '') }
    }
    else if (act.startsWith('dup:')) {
      const def = duplicateMap(act.slice(4), uniqueName(`${MAPS[act.slice(4)].name} copy`))
      storeCustomMap(def)
      openEditor(def.id)
    } else if (act.startsWith('map-')) {
      const [what, id] = act.split(':')
      const def = customMaps.find(d => d.id === id)
      if (!def) return
      if (what === 'map-play') startPlaytest(id)
      else if (what === 'map-edit') openEditor(id)
      else if (what === 'map-copy') { storeCustomMap(duplicateMap(id, uniqueName(`${def.name.slice(0, 27)} copy`))); showMyMaps() }
      else if (what === 'map-code') {
        exportCode = encodeMapCode(def)
        menu.setText('export-title', `Map code for "${def.name}". Anyone can paste it into Map Editor → Import a Map Code.`)
        menu.setText('export-status', '')
        menu.showExportCode(exportCode)
        menu.show('export')
      } else if (what === 'map-delete') {
        if (deleteArmed !== id) { deleteArmed = id; menu.showMyMaps(customMaps, id); return }
        removeCustomMap(id)
        showMyMaps(`Deleted "${def.name}".`)
      }
    }
    else if (act.startsWith('pk-toggle:')) changeSpawns(st => { const k = act.split(':')[1]; st[k].on = !st[k].on })
    else if (act.startsWith('pk-rate:')) changeSpawns(st => { const [, k, rate] = act.split(':'); st[k].rate = rate })
  })
  menu.showSettings(matchSettings)
  menu.showRotation(matchSettings.maps)
  menu.showSpawnSettings(spawnSettings)
  menu.showMap(practiceMap)
  resetRound(game)   // load the saved map choice
  const closePumpkinSettings = () => (pumpkinsReturnTo === 'match' ? openSettings() : menu.show(pumpkinsReturnTo))
  const closeMatchSettings = () => (matchReturnTo === 'paused' ? openPauseMenu() : menu.show(matchReturnTo))

  // practice dummies (0-3, your choice): around while you play alone, gone once a friend joins
  const DUMMY_STORAGE_KEY = 'pumpkin-fight-dummies'
  let dummyCount = 1
  try {
    const saved = localStorage.getItem(DUMMY_STORAGE_KEY)
    if (saved !== null && Number.isFinite(Number(saved))) dummyCount = clamp(Math.round(Number(saved)), 0, MAX_PLAYERS - 1)
  } catch (e) {}
  const playingAlone = () => mode === 'practice' || (mode === 'host' && !links.size)
  function changeDummies(n) {
    dummyCount = clamp(n, 0, MAX_PLAYERS - 1)
    try { localStorage.setItem(DUMMY_STORAGE_KEY, String(dummyCount)) } catch (e) {}
    menu.setText('dummy-count', String(dummyCount))
    menu.setText('wait-play', dummyCount ? 'Play vs Dummies While Waiting' : 'Play While Waiting')
    if (playingAlone()) setDummies(game, dummyCount)
  }
  changeDummies(dummyCount)

  // --- custom maps + the map editor ---
  let deleteArmed = null   // the map whose Delete was clicked once
  let exportCode = ''
  let playtestId = null    // playing a map from the editor (the Esc menu offers "Back to editor")
  const editor = createEditor(canvas, view, {
    onSave: def => storeCustomMap(sanitizeMap(def)),
    onPlaytest: id => startPlaytest(id),
    onExit: () => {
      closeEditor()
      showMyMaps()
    },
  })
  function refreshMapMenus() {
    menu.rebuildMaps()
    menu.showMap(practiceMap)
    menu.showRotation(matchSettings.maps)
  }
  // "My map" → "My map (2)" if that name's taken
  function uniqueName(name, id) {
    const taken = n => customMaps.some(d => d.name === n && d.id !== id)
    for (let i = 2; taken(name); i++) name = `${name.replace(/ \(\d+\)$/, '').slice(0, 26)} (${i})`
    return name
  }
  // add or update one of this browser's maps: saved, playable, and (if new) in the rotation
  function storeCustomMap(def) {
    const i = customMaps.findIndex(d => d.id === def.id)
    if (i >= 0) customMaps[i] = def
    else customMaps.push(def)
    saveCustomMaps(customMaps)
    registerMap(def)
    if (matchSettings.maps[def.id] === undefined) changeSettings(m => { m.maps[def.id] = true })
    refreshMapMenus()
  }
  function removeCustomMap(id) {
    customMaps = customMaps.filter(d => d.id !== id)
    saveCustomMaps(customMaps)
    unregisterMap(id)
    changeSettings(m => {
      delete m.maps[id]
      if (!mapIds().some(k => m.maps[k])) m.maps.patch = true   // keep at least one map on
    })
    if (practiceMap === id) chooseMap('patch')
    if (game.map === id) { game.mapChoice = practiceMap; resetRound(game) }
    refreshMapMenus()
  }
  function showMyMaps(status = '') {
    deleteArmed = null
    menu.showMyMaps(customMaps, null)
    menu.setText('maps-status', status)
    menu.show('maps')
  }
  // load a map fresh (it may have been edited since it was last loaded)
  function reloadMap(id) {
    game.mapChoice = id
    loadMap(game, id)
    resetRound(game)
  }
  function openEditor(id) {
    const def = customMaps.find(d => d.id === id)
    if (!def) { showMyMaps(); return }
    leaveSession()
    menu.hide()
    editor.open(def)
    resize()
  }
  function closeEditor() {
    if (!editor.active) return
    editor.close()
    resize()
    keys.clear()
    tapped.clear()
    reloadMap(practiceMap)
  }
  function startPlaytest(id) {
    if (!MAPS[id] || MAPS[id].playable === false) return
    leaveSession()
    closeEditor()
    playtestId = id
    reloadMap(id)
    menu.hide()
    showMessage(`Play testing "${MAPS[id].name}". Press Esc to get back to the editor.`, 4)
  }

  // The host's custom maps, on the guest: only for this session (cleaned up like any other map).
  let sessionMapIds = []
  function addSessionMaps(maps) {
    for (const raw of Array.isArray(maps) ? maps.slice(0, 50) : []) {
      const def = sanitizeMap(raw)
      if (!def || (MAPS[def.id] && !sessionMapIds.includes(def.id))) continue   // (never replace our own maps)
      registerMap(def)
      sessionMapIds.push(def.id)
    }
  }

  function leaveSession() {
    if (playtestId) { playtestId = null; reloadMap(practiceMap) }
    for (const id of sessionMapIds) unregisterMap(id)
    sessionMapIds = []
    clearTimeout(joinTimer)
    const oldLinks = [link, ...links.values()].filter(Boolean)
    link = null              // cleared first so the links' onClose handlers know we meant it
    links.clear()
    for (const l of oldLinks) l.close()
    if (peer) peer.destroy()
    peer = null
    hostCode = null
    mode = 'practice'
    game.match = null
    game.mapChoice = practiceMap
    ui.localIndex = 0
    for (const p of [...game.players]) if (p.index !== 0) removePlayer(game, p.index)
    setDummies(game, dummyCount)
    tuning.setEnabled(true)
  }

  function startHosting() {
    leaveSession()
    resetRound(game)
    mode = 'host'
    menu.show('host')
    menu.setText('host-code', '····')
    menu.setText('host-status', 'Getting a code…')
    const open = () => {
      const code = makeCode()
      const p = peer = new Peer(NET.idPrefix + code, { debug: 1 })
      p.on('open', () => {
        hostCode = code
        menu.setText('host-code', code)
        showHostStatus()
      })
      p.on('connection', onGuestConnection)
      // lost the matchmaking server (not your friend): reconnect so people can still join
      p.on('disconnected', () => { if (peer === p) p.reconnect() })
      p.on('error', err => {
        if (peer !== p) return
        if (err.type === 'unavailable-id') { p.destroy(); open(); return }   // code taken, pick another
        if (links.size) { console.warn('peer error while playing', err); return }
        menu.setText('host-status', describePeerError(err))
      })
    }
    open()
  }

  function showHostStatus() {
    if (!hostCode) return
    menu.setText('host-status', links.size
      ? `Playing with ${friendNames()}. ${links.size < MAX_PLAYERS - 1 ? 'More friends can join with the same code.' : 'The game is full.'}`
      : '')
  }

  // A friend connects: they get the first free color. The first one starts a match; anyone
  // after that jumps in at the start of the next round.
  function onGuestConnection(conn) {
    conn.on('open', () => {
      if (mode !== 'host') { conn.close(); return }
      const slot = [1, 2, 3].find(k => !links.has(k))
      if (slot === undefined) { conn.send({ t: 'full' }); setTimeout(() => conn.close(), 500); return }
      const name = PLAYER_COLOR_NAMES[slot]
      const l = new HostLink(conn, {
        onClose: () => {
          if (links.get(slot) !== l) return
          links.delete(slot)
          removePlayer(game, slot)
          showHostStatus()
          if (!links.size) {   // everyone left: back to playing alone
            game.match = null
            setDummies(game, dummyCount)
            startTransition(game, practiceMap)
            showMessage(`${name} left. Code ${hostCode} still works if anyone wants to join.`, 5)
          } else showMessage(`${name} left.`)
        },
        onWarning: text => showMessage(text, 8),
      }, now())
      links.set(slot, l)
      l.send({ t: 'maps', maps: customMaps })   // before any snapshot can use one
      l.send({ t: 'welcome', slot })
      if (!game.match) {
        setDummies(game, 0)
        addPlayer(game, slot)
        startMatch(game, matchSettings)
        menu.hide()
        showMessage(`${name} joined!`)
      } else {
        queuePlayer(game, slot)
        showMessage(`${name} joined! They'll jump in next round.`)
      }
      showHostStatus()
    })
  }

  function joinGame(code) {
    leaveSession()
    menu.show('join')
    if (!/^[A-Z0-9]{4}$/.test(code)) { menu.setText('join-status', 'Codes are 4 letters/numbers.'); return }
    menu.setText('join-status', 'Connecting…')
    const p = peer = new Peer({ debug: 1 })
    const fail = text => {
      if (peer !== p) return
      leaveSession()
      menu.show('join')
      menu.setText('join-status', text)
    }
    joinTimer = setTimeout(() => fail("Couldn't connect in time. Check the code and try again."), NET.connectTimeout)
    p.on('error', err => {
      if (link) { console.warn('peer error while playing', err); return }
      fail(describePeerError(err))
    })
    p.on('open', () => {
      const conn = p.connect(NET.idPrefix + code, { reliable: true, serialization: 'json' })
      conn.on('open', () => {
        if (peer !== p) { conn.close(); return }
        clearTimeout(joinTimer)
        mode = 'guest'
        ui.localIndex = -1   // (until the host says which player we are)
        tuning.setEnabled(false)
        const l = link = new GuestLink(conn, {
          onClose: () => {
            if (link !== l) return
            leaveSession()
            menu.show('main')
            menu.setText('main-status', 'Lost connection to the host.')
          },
          onFull: () => fail(`That game is full (${MAX_PLAYERS} players).`),
          onWarning: text => showMessage(text, 8),
          onMaps: maps => addSessionMaps(maps),
          onWelcome: slot => { ui.localIndex = slot; showMessage(`You're ${PLAYER_COLOR_NAMES[slot]}!`) },
        }, now())
        menu.hide()
      })
    })
  }

  function describeSession() {
    if (mode === 'guest') return `Playing online as ${PLAYER_COLOR_NAMES[ui.localIndex] || '…'}.${snap && snap.match ? ` Match: ${describeSettings(snap.match)}.` : ''}${snap ? ` Map: ${mapDef(snap.map).name}.` : ''}`
    if (mode === 'host') return links.size ? `Hosting as Blue with ${friendNames()} (code ${hostCode}).` : `Hosting with code ${hostCode || '…'}. Waiting for friends.`
    if (playtestId) return `Play testing "${mapDef(playtestId).name}".`
    return 'Practice mode.'
  }

  function openPauseMenu() {
    menu.show('paused')
    menu.setText('paused-info', describeSession())
    menu.setShown('settings', mode !== 'guest')   // (guests play by the host's settings)
    menu.setText('exit-label', playtestId ? 'Exit to Editor' : 'Exit')
  }

  // Match Settings (from the host screen) / Settings (from the Esc menu): just the parts that apply right now
  function openSettings() {
    menu.show('match', matchReturnTo === 'paused' ? 'Settings' : 'Match Settings')
    menu.setShown('match-length', mode === 'host')
    menu.setShown('rotation', mode === 'host')
    menu.setShown('practice-map', playingAlone() && !playtestId)
    menu.setShown('dummies', playingAlone() && !playtestId)
    menu.setShown('restart', mode === 'host' && links.size > 0)
  }

  // --- canvas & input ---
  function resize() {
    const dpr = window.devicePixelRatio || 1
    view.w = window.innerWidth
    view.h = window.innerHeight
    canvas.width = view.w * dpr
    canvas.height = view.h * dpr
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
    const inset = editor.insets()   // (the map editor's toolbar and panel)
    const w = view.w - inset.right, h = view.h - inset.top
    view.s = Math.min(w / CONFIG.view.w, h / CONFIG.view.h)
    view.ox = (w - CONFIG.view.w * view.s) / 2
    view.oy = inset.top + (h - CONFIG.view.h * view.s) / 2
  }
  resize()
  window.addEventListener('resize', resize)

  window.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input, textarea, select')) return   // typing a code, a map name, ...
    if (editor.active) { editor.onKey(e); return }
    if (e.code === 'Backquote') {
      ui.debug = !ui.debug
      tuning.setVisible(ui.debug)
    }
    if (e.code === 'Escape') {
      if (!menu.open) openPauseMenu()
      else if (menu.screen === 'paused') menu.hide()
      else if (menu.screen === 'pumpkins') closePumpkinSettings()
      else if (menu.screen === 'match') closeMatchSettings()
    }
    if (['Space', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault()
    keys.add(e.code)
    tapped.add(e.code)
  })
  window.addEventListener('keyup', e => keys.delete(e.code))
  window.addEventListener('blur', () => { keys.clear(); mouse.down = false })
  canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY })
  canvas.addEventListener('mousedown', e => {
    if (e.button !== 0) return
    mouse.down = true
    tapped.add('Mouse')
  })
  window.addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false })
  canvas.addEventListener('contextmenu', e => e.preventDefault())

  const held = (...codes) => codes.some(c => keys.has(c) || tapped.has(c))

  function localInput() {
    const aimX = (mouse.x - view.ox) / view.s
    const aimY = CONFIG.view.h - (mouse.y - view.oy) / view.s
    if (menu.open) return { ...emptyInput(), aimX, aimY }   // no controls while the menu is up
    return {
      left: held('KeyA', 'ArrowLeft'),
      right: held('KeyD', 'ArrowRight'),
      jump: held('KeyW', 'Space', 'ArrowUp'),
      throw: held('Mouse') || mouse.down,
      harvest: held('KeyE'),
      ragdoll: held('KeyR'),
      aimX, aimY,
    }
  }

  // --- main loop ---
  let last = performance.now()
  let acc = 0
  let steps = 0
  let snap = null
  function update(ms) {
    const elapsed = Math.min(0.25, (ms - last) / 1000)
    last = ms
    ui.fps = lerp(ui.fps, 1 / Math.max(elapsed, 1e-3), 0.05)
    ui.overlay = editor.active ? editor.drawOverlay : null
    ui.aim = { x: (mouse.x - view.ox) / view.s, y: CONFIG.view.h - (mouse.y - view.oy) / view.s }   // (for the aim line)
    if (editor.active) {   // the game holds still while you edit
      acc = 0
      snap = editor.snapshot()
      updateEffects(effects, elapsed)
      ui.message = ''
      return
    }
    acc += elapsed

    if (mode === 'guest' && link) {
      while (acc >= CONFIG.dt) {
        link.sendInput(localInput())
        tapped.clear()
        acc -= CONFIG.dt
      }
      const out = link.advance(elapsed)
      for (const ev of out.events) spawnEffect(effects, ev)
      snap = out.snap
    } else {
      while (acc >= CONFIG.dt) {
        const inputs = [localInput()]   // by slot: you, your friends, the dummies
        for (const [slot, l] of links) inputs[slot] = l.takeInput()
        for (const p of game.players) if (p.isDummy) inputs[p.index] = dummyInput(game, p)
        stepGame(game, inputs)
        tapped.clear()
        const events = game.events.splice(0)
        for (const ev of events) spawnEffect(effects, ev)
        if (links.size) {
          for (const l of links.values()) l.pendingEvents.push(...events)
          if (++steps % NET.snapshotEvery === 0) {
            const shared = makeSnapshot(game)
            for (const l of links.values()) l.sendSnapshot(game, shared)
          }
        }
        acc -= CONFIG.dt
      }
      snap = makeSnapshot(game)
    }
    if (link) link.tick(now())
    for (const l of links.values()) l.tick(now())
    updateEffects(effects, elapsed * (snap ? snap.timeScale ?? 1 : 1))   // particles slow down in slow motion

    // HUD + debug text
    const pings = [link, ...links.values()].filter(l => l && l.ping !== null).map(l => l.ping)
    const pingText = pings.length ? ` · ping ${Math.round(Math.max(...pings) * 1000)} ms` : ''
    const myColor = PLAYER_COLOR_NAMES[ui.localIndex] || '…'
    ui.hud = mode === 'host' && !links.size ? `Waiting for friends · code ${hostCode || '…'}` : playtestId ? 'Play test' : 'Practice'
    let waitText = ''
    if (mode === 'guest' && !snap) waitText = 'Waiting for the host…'
    else if (mode === 'guest' && ui.localIndex > 0 && !snapPlayer(snap, ui.localIndex)) waitText = `You'll jump in next round as ${myColor}!`
    ui.message = now() < flash.until ? flash.text : waitText
    ui.game = mode === 'guest' ? null : game
    if (ui.debug) {
      const me = mode === 'guest' ? null : game.players[0]
      ui.debugLines = [
        `fps ${ui.fps.toFixed(0)}  mode ${mode}${pingText}`,
        me ? `grounded ${me.grounded}  groundDist ${me.groundDist === null ? '-' : me.groundDist.toFixed(2)}` : `snapshots buffered ${link ? link.snaps.length : 0}`,
        me && game.players[1] ? `stun ${Math.max(0, me.stunTimer).toFixed(2)}  vx ${me.torso.getLinearVelocity().x.toFixed(1)}  ${game.players[1].name} stagger ${game.players[1].staggerMeter.toFixed(0)}/${CONFIG.damage.staggerAt}  dmg ${game.players[1].damageTaken.toFixed(0)}` : '',
        `pumpkins ${snap ? snap.pumpkins.length : 0}  particles ${effects.particles.length}`,
      ]
    }
  }

  function frame(ms) {
    update(ms)
    render(ctx, view, snap, effects, ui)
    requestAnimationFrame(frame)
  }
  requestAnimationFrame(frame)

  // Browsers pause requestAnimationFrame in background tabs. While hidden, a tiny
  // worker keeps the game ticking so an online match doesn't freeze or time out.
  startBackgroundTicker(() => { if (document.hidden) update(performance.now()) })
}

function startBackgroundTicker(onTick) {
  try {
    const src = 'setInterval(() => postMessage(0), 1000 / 60)'
    const worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })))
    worker.onmessage = onTick
  } catch (e) {
    setInterval(onTick, 1000 / 60)   // fallback: slowed down in background tabs, but better than nothing
  }
}

if (typeof document !== 'undefined') boot()
</script>
</body>
</html>
